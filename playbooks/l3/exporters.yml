---
# ==============================================================================
# Developmi Hardened | L3 Observability - Metrics Exporters
# ==============================================================================
# Purpose: Deploy node_exporter + cadvisor exporters on enabled nodes.
# Extracted from monitoring.yml Play 1.
# Note: Optional add-on for servers with sufficient resources.
# ==============================================================================

- name: "Deploy Metrics Exporters (Brain + Muscle)"
  hosts: all
  become: true
  gather_facts: true
  tags: [l3-observability, observability, monitoring, exporters, node_exporter, cadvisor]
  pre_tasks:
    - name: "Preflight: Require overlay-network ansible_host for observability operations"
      ansible.builtin.include_tasks: ../_shared/overlay_preflight.yml
      tags: [l3-observability, observability, monitoring, exporters, node_exporter, cadvisor]
  roles:
    - role: L3_observability
      vars:
        observability_prepare_exporters: true
        observability_prepare_stack: false
      when:
        - enable_metrics_exporters | default(false) | bool
        - host_class | default('') != 'local'
