---
# -----------------------------------------------------------------------------
# NON-SECRET IMAGE PINNING & DEPLOYMENT DEFAULTS
# -----------------------------------------------------------------------------
# Keep image tags, package pins, and other non-sensitive defaults here.
# Keep tokens, API keys, and privacy-sensitive registry data in secrets.sops.yml.

# -----------------------------------------------------------------------------
# REVERSE PROXY & INGRESS
# -----------------------------------------------------------------------------
# Custom image namespace
image_namespace: "{{ vault_image_namespace }}"  # AC-3: value from secrets.sops.yml only
# Caddy image (SSOT: caddy-waf repo releases; v3.6.0 = caddy 2.11.7, coraza-caddy 2.6.1, coraza 3.7.0, CRS 4.30.0)
caddy_image: "ghcr.io/developmi/caddy-waf:v3.6.0"

# SHA256 digest (OCI index, multi-arch amd64+arm64) for supply chain verification.
# Enforced as a verification gate by the L4 role (docker_image_info digest match,
# tasks/caddy.yml 'Verify Caddy image digest if specified').
caddy_image_digest: "sha256:2cb5ba1569a036432bd56b725e7d0f05ad2b6088572dd74e1b84dd1c46f8ba79"

# Caddy WAF UI sidecar image (SSOT: caddy-waf-ui repo releases; v1.3.0)
caddy_ui_image: "ghcr.io/developmi/caddy-waf-ui:v1.3.0"

# SHA256 digest (OCI index, multi-arch amd64+arm64) for supply chain verification.
# Enforced as a verification gate by the L4 role (docker_image_info digest match,
# tasks/caddy.yml 'Verify UI image digest if specified').
caddy_ui_image_digest: "sha256:37195cd8256cc075fa074d08136302508b715dc7d01c8ca7af6d2210822fdf5b"

# -----------------------------------------------------------------------------
# GITHUB CONTAINER REGISTRY
# -----------------------------------------------------------------------------
github_username: "{{ vault_github_username }}"  # AC-3: value from secrets.sops.yml only

# -----------------------------------------------------------------------------
# PORTAINER MANAGER DEFAULTS
# -----------------------------------------------------------------------------
# Moved to inventory/group_vars/all/managers/portainer.yml (N4 confinement):
# the server/Edge agent images, the insecure-poll toggle and the target brain.
# The dead `server_url` key was REMOVED (zero consumers - design D3). Edge
# keys live in managers/portainer.sops.yml.

# -----------------------------------------------------------------------------
# GLOBAL CONFIGURATION - Cluster Identity
# -----------------------------------------------------------------------------
cluster_name: "cluster_primary"
timezone: "UTC"

# -----------------------------------------------------------------------------
# FILESYSTEM PATHS (Standardized)
# -----------------------------------------------------------------------------
app_base_dir: "/srv/app" # Base path for container apps

# -----------------------------------------------------------------------------
# RUNTIME PACKAGE PINNING
# -----------------------------------------------------------------------------
# Docker Engine package versions must stay explicit for reproducibility.
docker_version_map:
  Debian:
    bookworm: "5:29.5.3-1~debian.12~bookworm"
    bullseye: "5:29.3.0-1~debian.11~bullseye"
  Ubuntu:
    jammy: "5:29.5.3-1~ubuntu.22.04~jammy"
    noble: "5:29.3.0-1~ubuntu.24.04~noble"

# -----------------------------------------------------------------------------
# CONTAINER USER IDs
# -----------------------------------------------------------------------------
# AC-2: Keep these aligned with the container image user to avoid bind-mount
# permission issues (for example /var/log/caddy/access.log).
caddy_user_uid: 1337
caddy_user_gid: 1337

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION (Tailscale Zero Trust)
# -----------------------------------------------------------------------------
tailscale_mtu: 1280 # MTU for Tailscale
tailscale_metrics_port: 5252 # Tailscale metrics port

# -----------------------------------------------------------------------------
# ANSIBLE RUNTIME
# -----------------------------------------------------------------------------
ansible_python_interpreter: /usr/bin/python3 # Python interpreter for Ansible

# -----------------------------------------------------------------------------
# OBSERVABILITY
# -----------------------------------------------------------------------------
# Docs: https://github.com/VictoriaMetrics/VictoriaMetrics/releases/tag/v1.148.0
victoriametrics_image: "victoriametrics/victoria-metrics:v1.148.0"
# Docs: https://github.com/grafana/loki/releases/tag/v3.6.13
loki_image: "grafana/loki:3.6.13"
# Docs: https://github.com/grafana/alloy/releases/tag/v1.18.1
# Alloy is the supported successor of promtail (EOL 2026-03-02); ships Caddy
# log files (access/runtime/audit) to Loki over the stable push API.
alloy_image: "grafana/alloy:v1.18.1"
# Docs: https://github.com/grafana/grafana/releases/tag/v13.1.1
grafana_image: "grafana/grafana:13.1.1"
# Docs: https://github.com/prometheus/node_exporter/releases/tag/v1.12.1
node_exporter_image: "prom/node-exporter:v1.12.1"
# Docs: https://github.com/google/cadvisor/releases/tag/v0.60.5
cadvisor_image: "ghcr.io/google/cadvisor:v0.60.5"
# Docs: https://github.com/prometheus/blackbox_exporter/releases/tag/v0.27.0
blackbox_exporter_image: "prom/blackbox-exporter:v0.27.0"
