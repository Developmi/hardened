---
# ==============================================================================
# PACKAGE VERSION PINNING - Brain Group (Debian 12.14, ARM64)
# ==============================================================================
#
# These packages are held at their current version via apt-mark hold.
# brain-1 is Hetzner ARM64 - uses linux-image-arm64, NOT linux-image-amd64.
# To release: ansible-playbook -i inventory/hosts.ini site.yml --tags unhold
# ==============================================================================

# Kernel meta-package varies by distro (brain group is mixed Debian/Ubuntu)
_pinned_kernel_ubuntu:
  - linux-image-generic

_pinned_kernel_debian:
  - linux-image-amd64

_pinned_kernel: "{{ _pinned_kernel_ubuntu if ansible_facts['distribution'] == 'Ubuntu' else _pinned_kernel_debian }}"

pinned_packages: "{{ _pinned_kernel +
  ['openssh-server', 'openssh-client', 'openssh-sftp-server',
   'systemd', 'systemd-sysv', 'crowdsec'] }}"
