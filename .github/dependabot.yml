# Dependabot version updates for GitHub Actions. Coexists with pre-commit.ci.
# Enabling version-updates is a MANUAL repo-admin step (Settings > Code
# security and analysis); dependabot opens PRs only after it is enabled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
