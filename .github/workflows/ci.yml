name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-validate:
    name: Lint, Validate & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # astral-sh/setup-uv@v10.1.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        run: |
          uv run ansible-lint playbooks/l6/engine.yml playbooks/l6/portainer.yml playbooks/l6/backup-stack.yml playbooks/l4/edge.yml playbooks/l3/exporters.yml playbooks/l3/stack.yml playbooks/ops/nuke.yml

      - name: Run yamllint
        run: |
          uv run yamllint .

      - name: Validate playbook syntax
        run: |
          echo "🔍 Validating playbook syntax..."
          uv run ansible-playbook --syntax-check playbooks/site.yml
          uv run ansible-playbook --syntax-check playbooks/l6/engine.yml
          uv run ansible-playbook --syntax-check playbooks/l6/portainer.yml
          uv run ansible-playbook --syntax-check playbooks/l6/backup-stack.yml
          uv run ansible-playbook --syntax-check playbooks/l4/edge.yml
          uv run ansible-playbook --syntax-check playbooks/l3/exporters.yml
          uv run ansible-playbook --syntax-check playbooks/l3/stack.yml
          uv run ansible-playbook --syntax-check playbooks/ops/nuke.yml
          echo "✅ All playbooks have valid syntax"

      - name: Scan for exposed secrets
        run: |
          echo "🔍 Scanning for secrets with detect-secrets..."
          uv run detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files 'roles/.*/(defaults|vars)/.*\.yml' \
            --exclude-files group_vars/.*\.yml \
            --exclude-files ^\.venv/ \
            --exclude-files ^\.uv/ \
            --exclude-files ^node_modules/ \
            --exclude-files ^\.git/ \
            --all-files \
            2>&1 | tee detect-secrets-output.txt

          if [ ! -s detect-secrets-output.txt ] || grep -q '"results": {}' detect-secrets-output.txt; then
            echo "✅ No new secrets detected"
          else
            echo "❌ Potential secrets detected"
            echo "Do not commit secrets to version control"
            echo "Use Ansible Vault or environment variables instead"
            exit 1
          fi

  gitleaks:
    name: Secret Leak Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify gitleaks (sha256)
        run: |
          set -eo pipefail
          GITLEAKS_VERSION="8.23.3"
          # Version MUST remain 8.23.3: gitleaks v8.24+ requires a license for
          # organization domains. Recompute the sha256 on any version bump.
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' \
            "73a35edc2285afd689e712b8e0ebad3f2eaf94b0d67cd6e1f0ec693ac751bb4a" \
            "/tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

      # gitleaks v8 syntax is `git [flags] [repo]` (no `git log` subcommand);
      # `--log-opts` is passed to git log; `--redact` masks secrets in output;
      # `--config` loads .gitleaks.toml (extends defaults + path allowlist).
      - name: Scan PR commits (gitleaks)
        if: github.event_name == 'pull_request'
        env:
          # GITHUB_BASE_SHA is not a default Actions variable; expose the PR base.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE_SHA" HEAD)
          /tmp/gitleaks git --redact --config .gitleaks.toml --log-opts="${MERGE_BASE}..HEAD" .

      - name: Scan full history (gitleaks)
        if: github.event_name != 'pull_request'
        run: |
          /tmp/gitleaks git --redact --config .gitleaks.toml --log-opts="--all" .

  validate-roles:
    name: Validate Role Structure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [L1_os_baseline, L2_compliance, L3_observability, L4_networking, L6_runtime]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # astral-sh/setup-uv@v10.1.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Validate role structure
        run: |
          # L*-style roles have sublayers (general/, debian_12/, etc.)
          if ls "roles/${{ matrix.role }}"/*/tasks/main.yml 2>/dev/null | head -1 | grep -q .; then
            echo "✅ Role ${{ matrix.role }}: Structure valid"
            uv run ansible-lint "roles/${{ matrix.role }}"
          else
            echo "⚠️  Role ${{ matrix.role }}: No executable tasks found in sublayers"
          fi

  convergence-check:
    name: Convergence & Idempotency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # astral-sh/setup-uv@v10.1.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Final playbook syntax validation
        run: |
          echo "🔍 Final convergence check..."
          uv run ansible-playbook --syntax-check \
            -i inventory/hosts.ini.example \
            playbooks/site.yml playbooks/l6/engine.yml playbooks/l6/portainer.yml playbooks/l6/backup-stack.yml playbooks/l4/edge.yml playbooks/l3/exporters.yml playbooks/l3/stack.yml playbooks/ops/nuke.yml
          echo "✅ Convergence test passed"

  workflow-security-audit:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Sync toolchain
        run: |
          uv sync

      - name: Audit workflows (zizmor)
        run: |
          uv run zizmor .github/workflows
