name: Ansible Lint & YAML Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ansible-lint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # astral-sh/setup-uv@v10.2.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint on playbooks
        id: ansible-lint
        run: |
          uv run ansible-lint \
            --config-file .ansible-lint \
            playbooks/l6/engine.yml playbooks/l6/portainer.yml playbooks/l6/backup-stack.yml playbooks/l4/edge.yml playbooks/l3/exporters.yml playbooks/l3/stack.yml playbooks/ops/nuke.yml
        continue-on-error: true

      - name: Run yamllint on YAML files
        id: yamllint
        run: |
          uv run yamllint -c .yamllint \
            --format colored \
            --strict \
            . \
            2>&1 | tee yamllint_report.txt
        continue-on-error: true

      - name: Check Ansible version compatibility
        run: |
          uv run ansible --version

      - name: Validate playbook syntax
        run: |
          uv run ansible-playbook --syntax-check playbooks/l6/engine.yml
          uv run ansible-playbook --syntax-check playbooks/l6/portainer.yml
          uv run ansible-playbook --syntax-check playbooks/l6/backup-stack.yml
          uv run ansible-playbook --syntax-check playbooks/l4/edge.yml
          uv run ansible-playbook --syntax-check playbooks/l3/exporters.yml
          uv run ansible-playbook --syntax-check playbooks/l3/stack.yml
          uv run ansible-playbook --syntax-check playbooks/ops/nuke.yml

      - name: Report results to Job Summary
        if: always()
        env:
          ANSIBLE_OUTCOME: ${{ steps.ansible-lint.outcome }}
          YAMLLINT_OUTCOME: ${{ steps.yamllint.outcome }}
        run: |
          {
            echo "## 🔍 Code Quality Report"
            echo ""
            echo "### Ansible Lint"
            if [ "$ANSIBLE_OUTCOME" = "success" ]; then
              echo "✅ All playbooks passed linting"
            else
              echo "⚠️ Ansible Lint issues detected (see logs)"
            fi
            echo ""
            echo "### YAML Validation"
            if [ "$YAMLLINT_OUTCOME" = "success" ]; then
              echo "✅ All YAML files valid"
            else
              echo "⚠️ YAML validation warnings (see logs)"
            fi
            echo ""
            echo "**Security Note:** This project enforces NIST 800-53 compliance"
            echo "- All code changes are subject to security audit"
            echo "- See [CONTRIBUTING.md](CONTRIBUTING.md) for guidelines"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical lint errors
        if: steps.ansible-lint.outcome == 'failure' || steps.yamllint.outcome == 'failure'
        run: |
          echo "❌ Code quality checks failed"
          echo "Please fix the issues above before merging"
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: lint-reports
          path: |
            yamllint_report.txt

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # astral-sh/setup-uv@v10.2.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install secret detection tool
        run: |
          uv run detect-secrets --version

      - name: Scan for exposed secrets against baseline
        run: |
          uv run detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files 'roles/.*/(defaults|vars)/.*\.yml$' \
            --exclude-files 'group_vars/.*\.yml' > secrets_report.json

          if [ ! -s secrets_report.json ]; then
            echo "✅ No secrets detected outside baseline."
          else
            python3 -c "
            import json, sys
            with open('secrets_report.json') as f:
                data = json.load(f)
            results = data.get('results', {})
            if results:
                print(f'❌ Potential secrets detected in {len(results)} file(s):')
                for filepath, secrets in results.items():
                    print(f'  - {filepath} ({len(secrets)} secrets)')
                print('Do not commit secrets to version control. Use SOPS/Ansible Vault or update .secrets.baseline.')
                sys.exit(1)
            print('✅ No secrets detected outside baseline.')
            "
          fi

  ansible-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # astral-sh/setup-uv@v10.2.0

      - name: Sync toolchain
        run: |
          uv sync

      - name: Install Ansible collections
        run: |
          uv run ansible-galaxy collection install -r requirements.yml

      - name: Verify playbook structure
        run: |
          echo "Checking playbook structure..."
          uv run ansible-playbook --list-hosts playbooks/l6/engine.yml 2>&1 | grep -E "hosts|FATAL" || true
          uv run ansible-playbook --list-hosts playbooks/l6/portainer.yml 2>&1 | grep -E "hosts|FATAL" || true
          uv run ansible-playbook --list-hosts playbooks/l6/backup-stack.yml 2>&1 | grep -E "hosts|FATAL" || true
          uv run ansible-playbook --list-hosts playbooks/l4/edge.yml 2>&1 | grep -E "hosts|FATAL" || true
          uv run ansible-playbook --list-hosts playbooks/l3/exporters.yml 2>&1 | grep -E "hosts|FATAL" || true
          uv run ansible-playbook --list-hosts playbooks/l3/stack.yml 2>&1 | grep -E "hosts|FATAL" || true

      - name: Validate inventory format
        run: |
          if [ -f inventory/hosts.ini ]; then
            uv run ansible-inventory -i inventory/hosts.ini --list > /dev/null
            echo "✅ Inventory valid"
          fi
