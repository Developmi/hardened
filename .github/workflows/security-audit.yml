name: Security Audit

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-audit:
    name: Security Audit Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Sync toolchain
        run: |
          uv sync

      - name: Verify detect-secrets baseline is valid
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline > /dev/null

      - name: Ensure vault secrets file is not tracked
        run: |
          # D10 public-zone hermeticity: the retired Ansible vault file must
          # never be tracked in the public template (task 2.11). The operator
          # keeps it locally ONLY for the tailscale trio until key expiry
          # (OPERATIONS_RUNBOOK §7.4); removal from git is an operator step
          # (git ls-files + git rm) - this gate prevents future re-adds.
          if git ls-files --error-unmatch inventory/group_vars/all/secrets.yml >/dev/null 2>&1; then
            echo "ERROR: inventory/group_vars/all/secrets.yml is tracked in git. Remove it from history and index."
            exit 1
          fi

      - name: Ensure SOPS files contain no plaintext secret values
        run: |
          set -euo pipefail
          # D10: the .sops.yml files are gitignored in the public template
          # (task 2.7); in the operator's PRIVATE clone (Model A) committed ENC
          # is the norm, so this check guards the VALUES instead of tracking:
          # any top-level key whose value is not ENC[...] and not an explicit
          # placeholder (PLACEHOLDER / REPLACE_WITH / example.invalid / your-)
          # or structural ([{>|, empty) is a leak candidate.
          for f in inventory/group_vars/all/secrets.sops.yml \
                   inventory/group_vars/all/managers/portainer.sops.yml; do
            [ -f "$f" ] || continue
            if grep -E '^[a-z_][a-z0-9_]*:' "$f" | grep -vE 'ENC\[|PLACEHOLDER|REPLACE_WITH|example\.invalid|your-|\.ts\.net|: *$|: *[|>\[{]' >/dev/null; then
              echo "ERROR: $f contains plaintext values. Encrypt with make sops-encrypt before committing."
              exit 1
            fi
          done

      - name: Scan repository for high-risk credential patterns
        run: |
          set -euo pipefail
          if rg -n --hidden -g '!.git' -g '!**/.venv/**' -e 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}' ; then
            echo "ERROR: Potential hardcoded secrets detected."
            exit 1
          fi

      - name: Dependency vulnerability scan
        run: |
          uvx pip-audit -r requirements.txt
