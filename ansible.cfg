# developmi hardened restructuring, June 2026 - paths verified correct
[defaults]
inventory = inventory/hosts.ini
# Host key checking enabled for security; use ssh-keyscan or manually accept first connection
host_key_checking = True
# SOPS vars plugin (D1): list REPLACES the core default ['host_group_vars'], so
# host_group_vars MUST stay first or plaintext group_vars silently stop loading.
vars_plugins_enabled = host_group_vars,community.sops.sops
retry_files_enabled = False
gathering = smart
forks = 10
timeout = 60
stdout_callback = default
roles_path = roles
remote_tmp = ~/.ansible/tmp

[community.sops]
# Intermediate-state protection (decouple-manager-sops): while the operator
# migrates, the committed *.sops.yml files are plaintext placeholders. With the
# default 'error' every inventory load would fail; 'warn' skips unencrypted
# files with a visible warning until they are encrypted (sops >= 3.9.0).
handle_unencrypted_files = warn

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=3600s -o ServerAliveInterval=60 -o ServerAliveCountMax=6
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
timeout = 60

[privilege_escalation]
# become=True applies to EVERY task that does not set its own become keyword.
# CAUTION: tasks delegating to localhost (controller-side work) must ALWAYS set
# become: false, or Ansible will try to sudo on the control node. Note that an
# ansible_become VAR (play vars / group_vars / -e) wins even over task
# keywords - controller-side work belongs in its own play with connection:
# local + become: false as play keywords (see playbooks/ops/bootstrap.yml).
become = True
become_method = sudo
become_user = root
become_ask_pass = False
timeout = 60
