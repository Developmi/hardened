[project]
name = "developmi-hardened"
version = "v7.0.0"
description = "Ansible-driven hardening suite for Bare Metal infrastructure"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ansible-core==2.21.1",
    "ansible-lint==26.6.0",
    "ansible-vault==4.1.0",
    "detect-secrets==1.5.0",
    "jinja2==3.1.6",
    "pre-commit==4.6.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "yamllint>=1.38.0",
    "zizmor>=1.26.1",
]
test = [
    "molecule>=26.6.0",
    "molecule-plugins[docker]>=26.7.15",
    "pytest>=9.1.1",
    "pytest-ansible>=26.6.0",
    "testinfra>=6.0.0",
]
