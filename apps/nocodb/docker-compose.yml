# Docker Compose - user-managed
# This stack does NOT deploy applications.
# The operator is responsible for providing their own compose file.

x-nocodb-env: &nocodb_env
  NC_DB: pg://${NOCDB_DB_HOST:-postgres}:${NOCDB_DB_PORT:-5432}?u=${NOCDB_DB_USER:-nocodb}&p=${NOCDB_DB_PASSWORD}&d=${NOCDB_DB_NAME:-nocodb}
  NC_PUBLIC_URL: ${NOCDB_PUBLIC_URL:-http://localhost:8080}
  NC_DISABLE_TELEMETRY: ${NOCDB_DISABLE_TELEMETRY:-true}

services:
  nocodb:
    image: ${NOCDB_IMAGE:-nocodb/nocodb:2026.09.1}
    container_name: nocodb
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *nocodb_env
    volumes:
      - nocodb_data:/usr/app/data
    networks:
      - nocodb_net
      - expose_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  postgres:
    image: ${NOCDB_DB_IMAGE:-postgres:17.11-alpine}
    container_name: nocodb-db
    restart: always
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    environment:
      POSTGRES_USER: ${NOCDB_DB_USER:-nocodb}
      POSTGRES_PASSWORD: ${NOCDB_DB_PASSWORD}
      POSTGRES_DB: ${NOCDB_DB_NAME:-nocodb}
    volumes:
      - nocodb_postgres_data:/var/lib/postgresql/data
    networks:
      - nocodb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nocodb} -d $${POSTGRES_DB:-nocodb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

volumes:
  nocodb_data:
    name: nocodb_data
  nocodb_postgres_data: {}

networks:
  expose_network:
    name: ${SHARED_NETWORK_NAME:-public_net}
    external: true
  nocodb_net:
    driver: bridge
