# Docker Compose - user-managed (Developmi Platform Hardened Standard)
# Application: Plane (Open-source Project Management Platform)
# Reference: makeplane/plane v1.4.2+ Community Edition

x-common-hardening: &common-hardening
  init: true
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-plane-minio-key}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-plane-minio-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost:8090}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  LISTEN_HTTP_PORT: 80
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost:8090}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090}
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD}@plane-db:5432/${POSTGRES_DB:-plane}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: amqp://${RABBITMQ_USER:-plane}:${RABBITMQ_PASSWORD}@plane-mq:5672/${RABBITMQ_VHOST:-plane}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  # --- INFRASTRUCTURE LAYER (Isolated on internal network) ---
  plane-db:
    <<: *common-hardening
    image: ${PLANE_DB_IMAGE:-postgres:15.7-alpine}
    container_name: plane-db
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    environment:
      <<: *db-env
    volumes:
      - plane_pgdata:/var/lib/postgresql/data
    networks:
      - plane_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-plane} -d $${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  plane-redis:
    <<: *common-hardening
    image: ${PLANE_REDIS_IMAGE:-valkey/valkey:7.2.11-alpine}
    container_name: plane-redis
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - plane_redisdata:/data
    networks:
      - plane_net
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  plane-mq:
    <<: *common-hardening
    image: ${PLANE_MQ_IMAGE:-rabbitmq:3.13.6-management-alpine}
    container_name: plane-mq
    environment:
      <<: *mq-env
    volumes:
      - plane_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - plane_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  plane-minio:
    <<: *common-hardening
    image: ${PLANE_MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: plane-minio
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - plane_uploads:/export
    networks:
      - plane_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # --- MIGRATIONS & BACKEND LAYER ---
  plane-migrator:
    init: true
    security_opt:
      - no-new-privileges:true
    image: ${PLANE_BACKEND_IMAGE:-makeplane/plane-backend:v1.4.2}
    container_name: plane-migrator
    command: ./bin/docker-entrypoint-migrator.sh
    restart: "no"
    volumes:
      - plane_logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  api:
    <<: *common-hardening
    image: ${PLANE_BACKEND_IMAGE:-makeplane/plane-backend:v1.4.2}
    container_name: plane-api
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - plane_logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  worker:
    <<: *common-hardening
    image: ${PLANE_BACKEND_IMAGE:-makeplane/plane-backend:v1.4.2}
    container_name: plane-worker
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - plane_logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_started
      plane-mq:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  beat-worker:
    <<: *common-hardening
    image: ${PLANE_BACKEND_IMAGE:-makeplane/plane-backend:v1.4.2}
    container_name: plane-beat-worker
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - plane_logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on:
      api:
        condition: service_started
      plane-mq:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # --- FRONTEND & REALTIME LAYER ---
  web:
    <<: *common-hardening
    image: ${PLANE_FRONTEND_IMAGE:-makeplane/plane-frontend:v1.4.2}
    container_name: plane-web
    depends_on:
      api:
        condition: service_started
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  space:
    <<: *common-hardening
    image: ${PLANE_SPACE_IMAGE:-makeplane/plane-space:v1.4.2}
    container_name: plane-space
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  admin:
    <<: *common-hardening
    image: ${PLANE_ADMIN_IMAGE:-makeplane/plane-admin:v1.4.2}
    container_name: plane-admin
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  live:
    <<: *common-hardening
    image: ${PLANE_LIVE_IMAGE:-makeplane/plane-live:v1.4.2}
    container_name: plane-live
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy
    networks:
      - plane_net
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  # --- UNIFIED INGRESS / PROXY LAYER ---
  plane-proxy:
    <<: *common-hardening
    image: ${PLANE_PROXY_IMAGE:-makeplane/plane-proxy:v1.4.2}
    container_name: plane-proxy
    environment:
      <<: *proxy-env
    ports:
      # Exposes on an internal port (8090) so it does NOT conflict with Caddy WAF on 80/443
      - "${PLANE_BIND_IP:-127.0.0.1}:${PLANE_PORT:-8090}:80"
    volumes:
      - plane_proxy_config:/config
      - plane_proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    networks:
      - plane_net
      - expose_network
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

volumes:
  plane_pgdata: {}
  plane_redisdata: {}
  plane_uploads: {}
  plane_rabbitmq_data: {}
  plane_logs_api: {}
  plane_logs_worker: {}
  plane_logs_beat-worker: {}
  plane_logs_migrator: {}
  plane_proxy_config: {}
  plane_proxy_data: {}

networks:
  expose_network:
    name: ${SHARED_NETWORK_NAME:-public_net}
    external: true
  plane_net:
    driver: bridge
