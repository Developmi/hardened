---
# Portainer - Container management platform (L5)
supported_arch: [amd64, arm64]
depends_on: []

monitoring:
  enabled: true
  health_endpoint: "/api/status"
  health_port: 9443
  scrape_port: 9443

compliance_tags:
  - cis-docker:4.1
  - cis-docker:5.1
  - cis-os:5.1.2
  - soc2:cc6.1
  - iso27001:a.8.2.3

dr_tier: tier2

backup:
  method: file-volume
  schedule: "*-*-* 02:30:00"
  retention_daily: 14
  retention_weekly: 8
  retention_monthly: 12
  verification: quarterly-restore-test
  db_type: sqlite
  db_name: portainer
  volumes:
    - name: portainer_data
      mount_path: /data
      consistency: quiesce
