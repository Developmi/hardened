---
# Molecule test variables for the backup layer scenario
# (SDD capability: backup-profile-integration).
#
# R2 variables are DUMMY values that satisfy the role's vault-var assert
# (timers.yml). No backup is executed in this scenario - only systemd
# timer/service units are deployed and asserted.

enable_backups: true
deployed_apps: "{{ fixture_apps }}"

# Storage provider + repository base URL (STORAGE-004/005, D10). The role
# defaults build restic_repo_url / restic_appdata_repo_url from this value.
# The legacy `backup_r2_*` / `vault_backup_r2_*` namespace is retired (D4);
# `restic_r2_*` is the single credential namespace (STORAGE-005).
backup_provider: r2
backup_repo_base_url: "s3:https://molecule-test.example.com/molecule-backups"

# Restic credentials rendered into /etc/restic/env by credentials.yml
# (STORAGE-003 / D7). Dummy values - no backup runs in this scenario.
restic_r2_account_id: "molecule-test-account"
restic_r2_access_key_id: "molecule-test-access-key"
restic_r2_secret_access_key: "molecule-test-secret-key" # pragma: allowlist secret
restic_telegram_bot_token: "molecule-test-bot-token"
restic_telegram_chat_id: "molecule-test-chat-id"

# Per-host repository password. credentials.yml resolves
# restic_password_<inventory_hostname with "-" -> "_"> (design D4); the Molecule
# platform is debian12-backup, so the container hostname is debian12-backup.
restic_password_debian12_backup: "molecule-test-restic-password" # pragma: allowlist secret

# Fixture apps mirrored from apps/*/profile.yml (reduced schema).
# legacy-app carries a stale `name` field on purpose (BPI-004-02 regression).
# quiesce-app declares a `consistency: quiesce` volume (TIER-003).
# absent-db declares pg_dump/postgres with NO SOPS password and NO container to
# prove deploy-time host affinity (Fix 3 / D6).
fixture_apps:
  - absent-db
  - chatwoot
  - clickhouse
  - legacy-app
  - mariadb
  - metabase
  - n8n
  - nocodb
  - openlit
  - openwebui
  - postgresql
  - quiesce-app
  - twenty-crm
  - uptime-kuma

# Per-app database backup passwords (D8/CRED-001..003). In a real deployment
# these live in SOPS (inventory/group_vars/all/secrets.sops.yml) as
# backup_db_<app>_password; here they are dummy sentinels consumed by
# tasks/db_credentials.yml to render /etc/restic/db-<app>.env (0600).
# chatwoot uses a distinctive sentinel so the credential-leak test can prove
# the value never reaches a command line or `docker inspect`.
backup_db_chatwoot_password: "LEAKCANARY_chatwoot_pw" # pragma: allowlist secret
backup_db_legacy_app_password: "molecule-test-legacy-pw" # pragma: allowlist secret
backup_db_mariadb_password: "molecule-test-mariadb-pw" # pragma: allowlist secret
backup_db_metabase_password: "molecule-test-metabase-pw" # pragma: allowlist secret
backup_db_n8n_password: "molecule-test-n8n-pw" # pragma: allowlist secret #gitleaks:allow
backup_db_nocodb_password: "molecule-test-nocodb-pw" # pragma: allowlist secret
backup_db_openwebui_password: "molecule-test-openwebui-pw" # pragma: allowlist secret
backup_db_postgresql_password: "molecule-test-postgresql-pw" # pragma: allowlist secret
backup_db_quiesce_app_password: "molecule-test-quiesce-pw" # pragma: allowlist secret
backup_db_twenty_crm_password: "molecule-test-twenty-pw" # pragma: allowlist secret
