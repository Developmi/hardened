---
# Verify: backup-profile-integration + unified engine (SDD)
# Proves the unified engine deploys dir-derived unit pairs against
# reduced-schema profiles (no `name` field), preserves skip semantics for
# db_type none/custom, rejects shell-metacharacter profile paths before render,
# asserts the rendered runner is executable (0755), and proves the runtime
# resolution contract with a stubbed docker: absent container -> exit 0, volume
# mount_path mismatch -> skip+log (D5/D6, ENGINE-003/004).
- name: Verify Backup Profile Integration (BPI) + Unified Engine
  hosts: all
  gather_facts: true
  vars:
    fixture_root: "{{ playbook_dir }}/fixtures/apps"
    threat_profile: "{{ playbook_dir }}/fixtures/threat/bad;name/profile.yml"
    role_tasks_dir: "{{ playbook_dir }}/../../roles/L6_runtime/backup/tasks"
    role_templates_dir: "{{ playbook_dir }}/../../roles/L6_runtime/backup/templates"
    role_defaults_file: "{{ playbook_dir }}/../../roles/L6_runtime/backup/defaults/main.yml"
    group_vars_main_file: "{{ playbook_dir }}/../../inventory/group_vars/all/main.yml"
    # NOT /tmp: the Molecule platform mounts /tmp as a noexec tmpfs, so the
    # executable docker/restic stubs must live on an exec-capable filesystem.
    shim_dir: /usr/local/lib/engine-shims
    enable_backups: true
    # Needed by the role's render path when the 004-05 threat test includes the
    # role directly (deploy_from_profile.yml renders the runner template).
    backup_provider: r2
    backup_repo_base_url: "s3:https://molecule-test.example.com/molecule-backups"
  pre_tasks:
    # vars.yml carries the per-host restic password sentinel consumed by the
    # role's credential/repo-init lookups (restic_password_debian12_backup).
    - name: "Verify | Include backup test variables"
      ansible.builtin.include_vars:
        file: vars.yml
  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
  tasks:
    # ---------------------------------------------------------------------------
    # GIVEN: the fixture profiles (control node) mirroring apps/*/profile.yml
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enumerate fixture profiles on the control node"
      ansible.builtin.find:
        paths: "{{ fixture_root }}"
        patterns: "profile.yml"
        recurse: true
      delegate_to: localhost
      # controller-side: never escalate on the control node (see ansible.cfg become=True)
      become: false
      register: fixture_files

    - name: "GIVEN: Load backup metadata from each fixture profile"
      ansible.builtin.include_vars:
        file: "{{ item.path }}"
        name: _fixture
      loop: "{{ fixture_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: loaded_fixtures

    # ---------------------------------------------------------------------------
    # THEN: expected units derive from app DIRECTORY names (BPI-001-01/-02)
    # ---------------------------------------------------------------------------
    - name: "THEN: Collect dump-able apps (db_type not none/custom)"
      ansible.builtin.set_fact:
        _expected_apps: "{{ _expected_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') not in ['none', 'custom']

    - name: "THEN: Collect skip apps (db_type none/custom) - BPI-003-02"
      ansible.builtin.set_fact:
        _skip_apps: "{{ _skip_apps | default([]) + [item.item.path | dirname | basename] }}"
      loop: "{{ loaded_fixtures.results }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._fixture.backup.db_type | default('') in ['none', 'custom']

    - name: "THEN: Guard - derivation produced a sane partition"
      ansible.builtin.assert:
        that:
          - _expected_apps | length >= 8
          - _skip_apps | length >= 1
        fail_msg: "Unexpected derivation: expected={{ _expected_apps | length }} skip={{ _skip_apps | length }}"
        success_msg: "Derived {{ _expected_apps | length }} dump-able apps and {{ _skip_apps | length }} skip apps from {{ fixture_files.files | length }} fixtures"

    # ---------------------------------------------------------------------------
    # THEN: engine timer + service units exist for every dump-able app (BPI-004-01)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat expected engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: expected_timer_stats

    - name: "THEN: Every dump-able app has a dir-derived engine timer unit"
      ansible.builtin.assert:
        that:
          - expected_timer_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine timer units: {{ expected_timer_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine timer units exist"

    - name: "GIVEN: Stat expected engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _expected_apps | sort }}"
      register: expected_service_stats

    - name: "THEN: Every dump-able app has a dir-derived engine service unit"
      ansible.builtin.assert:
        that:
          - expected_service_stats.results | map(attribute='stat.exists') | list | min == true
        fail_msg: "Missing engine service units: {{ expected_service_stats.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        success_msg: "All {{ _expected_apps | length }} expected engine service units exist"

    - name: "THEN: No retired backup-db-* unit remains on disk (ENGINE-001)"
      ansible.builtin.find:
        paths: /etc/systemd/system
        patterns: "backup-db-*"
      register: legacy_units

    - name: "THEN: Assert the retired backup-db-* prefix is gone"
      ansible.builtin.assert:
        that:
          - legacy_units.matched == 0
        fail_msg: "Retired backup-db-* units still present: {{ legacy_units.files | map(attribute='path') | list }}"
        success_msg: "No backup-db-* units on disk - engine naming only"

    - name: "GIVEN: Stat skip-app engine timer units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _skip_apps | sort }}"
      register: skip_timer_stats

    - name: "GIVEN: Stat skip-app engine service units"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-{{ item }}.service"
      loop: "{{ _skip_apps | sort }}"
      register: skip_service_stats

    - name: "THEN: Skip apps have NO units and no error was raised (BPI-003-02)"
      ansible.builtin.assert:
        that:
          - skip_timer_stats.results | map(attribute='stat.exists') | list | max == false
          - skip_service_stats.results | map(attribute='stat.exists') | list | max == false
        fail_msg: "Units deployed for skip apps (none/custom) - expected no units"
        success_msg: "No units deployed for db_type none/custom apps ({{ _skip_apps | join(', ') }})"

    # ---------------------------------------------------------------------------
    # THEN: rendered units are internally consistent (BPI-002-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp rendered engine timer units"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-{{ item }}.timer"
      loop: "{{ _expected_apps | sort }}"
      register: timer_contents

    - name: "THEN: Every engine timer Requires= references its own unit name (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - item.content | b64decode | regex_search('Requires=backup-engine-' ~ item.item ~ '\.service') is not none
        fail_msg: "Timer backup-engine-{{ item.item }}.timer does not Require= its matching service"
        success_msg: "Timer backup-engine-{{ item.item }}.timer Requires= backup-engine-{{ item.item }}.service"
      loop: "{{ timer_contents.results }}"

    # ---------------------------------------------------------------------------
    # THEN: templates render the derived name everywhere (BPI-002-01/-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Slurp the chatwoot timer unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.timer"
      register: chatwoot_timer

    - name: "GIVEN: Slurp the chatwoot service unit"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-engine-chatwoot.service"
      register: chatwoot_service

    - name: "THEN: chatwoot timer renders Description and Requires from the derived name (BPI-002-01)"
      ansible.builtin.assert:
        that:
          - chatwoot_timer.content | b64decode | regex_search('^Description=Backup timer for chatwoot$', multiline=True) is not none
          - chatwoot_timer.content | b64decode | regex_search('^Requires=backup-engine-chatwoot\.service$', multiline=True) is not none
        fail_msg: "chatwoot engine timer did not render the derived name"
        success_msg: "chatwoot engine timer renders the derived name in Description and Requires"

    - name: "THEN: chatwoot service invokes the unified engine, never aws s3 cp (BPI-002-02)"
      ansible.builtin.assert:
        that:
          - chatwoot_service.content | b64decode | regex_search('^Description=Unified backup engine for chatwoot$', multiline=True) is not none
          - chatwoot_service.content | b64decode | regex_search('^ExecStart=/usr/local/bin/backup-engine-chatwoot\.sh$', multiline=True) is not none
          - chatwoot_service.content | b64decode is not search('aws s3 cp')
        fail_msg: "chatwoot engine service did not render the engine invocation"
        success_msg: "chatwoot engine service invokes the unified engine and never aws s3 cp"

    # ---------------------------------------------------------------------------
    # THEN: legacy profile with a `name` field stays deterministic (BPI-004-02)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the legacy dir-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-app.timer"
      register: legacy_dir_unit

    - name: "GIVEN: Stat the legacy name-derived unit"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-engine-legacy-name.timer"
      register: legacy_name_unit

    - name: "THEN: Directory-derived name takes precedence over the stale name field (BPI-004-02)"
      ansible.builtin.assert:
        that:
          - legacy_dir_unit.stat.exists
          - not legacy_name_unit.stat.exists
        fail_msg: "Legacy profile unit naming is not deterministic (dir-derived name must win)"
        success_msg: "Legacy profile deploys backup-engine-legacy-app.timer; stale name field ignored"

    # ---------------------------------------------------------------------------
    # THREAT: executable-file - rendered runner is fixed 0755 (task 2.2)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the rendered chatwoot engine runner (threat executable-file)"
      ansible.builtin.stat:
        path: /usr/local/bin/backup-engine-chatwoot.sh
      register: chatwoot_runner

    - name: "THEN: The rendered engine runner exists with fixed mode 0755"
      ansible.builtin.assert:
        that:
          - chatwoot_runner.stat.exists
          - chatwoot_runner.stat.mode == '0755'
          - chatwoot_runner.stat.pw_name == 'root'
        fail_msg: "backup-engine-chatwoot.sh must exist as 0755 root (got mode={{ chatwoot_runner.stat.mode | default('absent') }})"
        success_msg: "backup-engine-chatwoot.sh is 0755 root"

    # ---------------------------------------------------------------------------
    # STORAGE-003 / D7: /etc/restic/env MUST exist on every backup host
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the restic environment file (STORAGE-003)"
      ansible.builtin.stat:
        path: /etc/restic/env
      register: restic_env_file
      when: enable_backups | default(false) | bool

    - name: "THEN: /etc/restic/env is present, root-owned and 0600 on every backup host (STORAGE-003)"
      ansible.builtin.assert:
        that:
          - restic_env_file.stat.exists
          - restic_env_file.stat.pw_name == 'root'
          - restic_env_file.stat.mode == '0600'
        fail_msg: >-
          /etc/restic/env is missing or has wrong ownership/mode on
          {{ inventory_hostname }}. Every enable_backups: true host must ship
          the restic environment file (D7/STORAGE-003).
        success_msg: "/etc/restic/env present, root-owned and 0600 on {{ inventory_hostname }}"
      when: enable_backups | default(false) | bool

    # ---------------------------------------------------------------------------
    # RUNTIME RESOLUTION (tasks 2.1): stub docker + restic, run the REAL runner.
    #   absent container -> exit 0 (ENGINE-004/D6)
    #   volume mount_path mismatch -> skip + log (ENGINE-003/D5)
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Create the stub bin directory"
      ansible.builtin.file:
        path: "{{ shim_dir }}"
        state: directory
        mode: "0755"

    - name: "GIVEN: Write the docker stub (container-present marker gate)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/docker"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Stub docker for the engine tests. It records its argv (so the
          # credential-leak test can prove no secret reaches a command line) and
          # simulates: container presence, `docker ps` Tier1 discovery,
          # per-container mounts, pause/unpause tracking, and a failing
          # `docker run` (tar abort) when the tar-abort marker is present.
          log_dir="{{ shim_dir }}"
          printf 'docker %s\n' "$*" >> "$log_dir/docker.log"
          if [ ! -f "$log_dir/container-present" ]; then
            exit 1
          fi
          case "$1" in
            ps)
              if [ -f "$log_dir/tier1-containers" ]; then
                printf 'pg1 postgres:16\ncache1 redis:7-alpine\nch1 clickhouse/clickhouse-server:24.3\nweb nginx:latest\n'
              fi
              exit 0
              ;;
            inspect)
              case "$2" in
                chatwoot|chatwoot-db)
                  # ENGINE-003-01: with the project-prefixed marker present the
                  # stub reports the Compose-style RESOLVED name at the
                  # DECLARED mount_path, so the volume happy path can be
                  # exercised. Default (marker absent) keeps the literal
                  # external name at a NON-matching destination, which is the
                  # skip+log regression case asserted below.
                  if [ -f "$log_dir/chatwoot-projectvol" ]; then
                    printf 'chatwoot_chatwoot_storage /app/data\n'
                  else
                    printf 'chatwoot_storage /app/storage\nundeclared_vol /secret/data\n'
                  fi ;;
                quiesce-app|quiesce-app-db)
                  printf 'qvol /app/qdata\n' ;;
                *)
                  printf 'stubvol /app/storage\n' ;;
              esac
              exit 0
              ;;
            pause)
              printf 'pause %s\n' "$2" >> "$log_dir/quiesce.log"
              exit 0
              ;;
            unpause)
              printf 'unpause %s\n' "$2" >> "$log_dir/quiesce.log"
              exit 0
              ;;
            run)
              if [ -f "$log_dir/tar-abort" ]; then
                exit 1
              fi
              exit 0
              ;;
            exec)
              cat >/dev/null 2>&1 || true
              # ClickHouse adapter probe (task 4.7): report clickhouse-backup
              # ABSENT when the marker exists so the fallback path is exercised.
              case "$*" in
                *"command -v clickhouse-backup"*)
                  if [ -f "$log_dir/ch-no-binary" ]; then exit 1; else exit 0; fi
                  ;;
              esac
              exit 0
              ;;
            *)
              exit 0
              ;;
          esac

    - name: "GIVEN: Write the restic stub (records invocations, drains stdin)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/restic"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Stub restic for the engine tests. Records argv and drains stdin (the
          # backup runners stream payloads with `--stdin`). The restore
          # verification runner is exercised for real: `snapshots --json`
          # reports one snapshot, `restore` writes a valid gzip payload into the
          # requested --target, and a `restore-fail` marker forces a non-zero
          # restore so the failure path can be proven (VERIFY-001/004).
          log_dir="{{ shim_dir }}"
          printf 'restic %s\n' "$*" >> "$log_dir/restic.log"
          cat >/dev/null 2>&1 || true
          case "$1" in
            snapshots)
              printf '[{"short_id":"abc12345","id":"abc12345","time":"2026-09-10T00:00:00Z"}]\n'
              exit 0
              ;;
            check)
              # VERIFY-002-02: a failing integrity check must be observable.
              # restic-check.service runs `/usr/local/bin/restic check` with no
              # `|| true`, so a non-zero exit leaves the systemd unit failed
              # (Result=exit-code). The default (marker absent) exits 0.
              if [ -f "$log_dir/check-fail" ]; then
                printf 'stub restic: repository corruption detected\n' >&2
                exit 1
              fi
              exit 0
              ;;
            cat)
              # App-data repo existence probe (Fix 4): report the repo EXISTS
              # only when the marker is present, so a virgin repo forces an init
              # while an existing repo is never re-initialized.
              if [ -f "$log_dir/appdata-repo-exists" ]; then exit 0; else exit 1; fi
              ;;
            restore)
              if [ -f "$log_dir/restore-fail" ]; then
                printf 'stub restic: restore failed\n' >&2
                exit 1
              fi
              target=""; prev=""
              for arg in "$@"; do
                if [ "$prev" = "--target" ]; then target="$arg"; fi
                prev="$arg"
              done
              if [ -n "$target" ]; then
                mkdir -p "$target"
                printf 'restored-payload\n' | gzip > "$target/app_restored.sql.gz"
              fi
              exit 0
              ;;
          esac
          exit 0

    - name: "GIVEN: Write the curl stub (records the notification, no network)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/curl"
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Stub curl for the restore-verification notification test. It records
          # argv (to prove no secret is on the command line, CRED-003) and the
          # stdin config (the Telegram payload travels via `-K -`).
          log_dir="{{ shim_dir }}"
          printf 'curl %s\n' "$*" >> "$log_dir/curl.log"
          cat >> "$log_dir/curl-stdin.log" 2>/dev/null || true
          exit 0

    - name: "GIVEN: Ensure the absent-container marker is removed"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: absent

    - name: "WHEN: Run the engine runner with the container ABSENT"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_absent_run
      changed_when: false
      failed_when: false

    - name: "THEN: Absent container exits 0 and logs the skip (ENGINE-004/D6)"
      ansible.builtin.assert:
        that:
          - engine_absent_run.rc == 0
          - "'absent' in (engine_absent_run.stderr | default(''))"
        fail_msg: "Runner did not skip cleanly on an absent container (rc={{ engine_absent_run.rc }})"
        success_msg: "Absent container -> exit 0 with skip log"

    - name: "GIVEN: Mark the container present and reset the restic log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    - name: "GIVEN: Remove any previous restic stub log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the engine runner with a mount_path MISMATCH"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: engine_mismatch_run
      changed_when: false
      failed_when: false

    - name: "THEN: Volume mismatch is skipped and logged, run still exits 0 (ENGINE-003/D5)"
      ansible.builtin.assert:
        that:
          - engine_mismatch_run.rc == 0
          - "'no volume mounted at' in (engine_mismatch_run.stderr | default(''))"
          - "'/app/data' in (engine_mismatch_run.stderr | default(''))"
        fail_msg: "Runner did not skip+log an unmatched mount_path (rc={{ engine_mismatch_run.rc }})"
        success_msg: "Unmatched mount_path -> skip+log, run continues"

    - name: "THEN: The declared DB was still dumped and streamed to restic"
      ansible.builtin.command:
        cmd: "grep -c 'backup --stdin' {{ shim_dir }}/restic.log"
      register: restic_invocations
      changed_when: false
      failed_when: false

    - name: "THEN: Assert the DB dump reached restic after the volume skip"
      ansible.builtin.assert:
        that:
          - restic_invocations.stdout | int >= 1
        fail_msg: "The DB dump did not reach restic after the volume skip"
        success_msg: "DB dump streamed to restic ({{ restic_invocations.stdout }} invocation(s))"

    # ---------------------------------------------------------------------------
    # THREAT MATRIX: shell metacharacters in profile paths fail before render
    # ---------------------------------------------------------------------------
    # The included task file (deploy_from_profile.yml) runs the REAL role logic:
    # include_vars succeeds (valid YAML), the derived name 'bad;name' fails the
    # ^[a-z0-9_-]+$ assert, and the template tasks never execute. Failure of the
    # block + absence of any unit proves fail-safe behavior.
    - name: "THREAT: Metacharacter profile path fails safely before render"
      block:
        - name: "WHEN: The role processes a profile path containing shell metacharacters"
          ansible.builtin.include_tasks: "{{ role_tasks_dir }}/deploy_from_profile.yml"
          loop:
            - "{{ threat_profile }}"
      rescue:
        - name: "THEN: The run failed (assert rejected the derived name)"
          ansible.builtin.assert:
            that:
              - 'threat_profile | dirname | basename is not match("^[a-z0-9_-]+$")'
            fail_msg: "Metachar app name unexpectedly passed the unit-name assert"
            success_msg: "Metachar app name 'bad;name' rejected by the unit-name assert"

        - name: "THEN: No unit was written for the metachar app"
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-engine-bad;name.timer"
          register: metachar_timer_unit

        - name: "THEN: Assert no metachar unit exists on disk"
          ansible.builtin.assert:
            that:
              - not metachar_timer_unit.stat.exists
            fail_msg: "A unit was deployed for a shell-metacharacter app name - FAIL"
            success_msg: "No unit deployed for shell-metacharacter app name"

    # ---------------------------------------------------------------------------
    # TIER-001 / D14 (task 3.1): Tier1 image-discovered database protection.
    # The engine deploys a host-level Tier1 runner that discovers postgres /
    # clickhouse / redis-valkey containers BY IMAGE (no app declaration) and
    # streams logical dumps to restic.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the Tier1 discovery runner (TIER-001)"
      ansible.builtin.stat:
        path: /usr/local/bin/backup-tier1.sh
      register: tier1_runner

    - name: "THEN: The Tier1 runner is deployed 0755 root (TIER-001)"
      ansible.builtin.assert:
        that:
          - tier1_runner.stat.exists
          - tier1_runner.stat.mode == '0755'
          - tier1_runner.stat.pw_name == 'root'
        fail_msg: "Tier1 discovery runner /usr/local/bin/backup-tier1.sh missing or wrong mode"
        success_msg: "Tier1 discovery runner deployed 0755 root"

    - name: "GIVEN: Mark Tier1 containers present"
      ansible.builtin.file:
        path: "{{ shim_dir }}/tier1-containers"
        state: touch
        mode: "0644"

    - name: "GIVEN: Reset the restic stub log for the Tier1 run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the Tier1 discovery runner"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-tier1.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier1_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier1 run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier1_restic_log
      changed_when: false
      failed_when: false

    - name: "THEN: Tier1 discovery dumps postgres + valkey by image and ignores others (TIER-001)"
      ansible.builtin.assert:
        that:
          - tier1_run.rc == 0
          - "'tier1,postgresql,pg1' in tier1_restic_log.stdout"
          - "'tier1,valkey,cache1' in tier1_restic_log.stdout"
          - "'nginx' not in tier1_restic_log.stdout"
        fail_msg: >-
          Tier1 image discovery did not protect the declared engine families
          (rc={{ tier1_run.rc }}). log={{ tier1_restic_log.stdout }}
        success_msg: "Tier1 discovery dumped postgres + valkey and ignored nginx"

    # ---------------------------------------------------------------------------
    # TIER-001-03 "Tier1 pipeline complete": the Tier1 cycle is not only
    # dump+upload (proven above) - it also runs RETENTION and VERIFICATION.
    #   * retention    = the host-level `restic-prune.service`
    #                    (`restic forget ... --prune`), the retention owner of
    #                    the app-data repository;
    #   * verification = the profile-derived restore-verification runner of a
    #                    Tier1 asset (chatwoot declares the Tier1 monthly cadence
    #                    per VERIFY-003).
    # The host-level unit set is NOT deployed by converge: Molecule converges the
    # ENGINE source path (backup_role_source=engine), and only the "stack" source
    # deploys systemd.yml. The two units this cycle needs are therefore rendered
    # here from the SHIPPED templates (the same source systemd.yml uses); the full
    # systemd.yml cannot be included because it starts restic-backup-all.timer,
    # whose service Requires=docker.service - absent inside this container. The
    # real restic binary is absent too (backup_engine_install_restic=false), so
    # the stub is exposed at restic_install_path for the units to execute.
    # ---------------------------------------------------------------------------
    - name: "TIER-001-03: Load the role defaults so the shipped unit templates resolve"
      ansible.builtin.include_vars:
        file: "{{ role_defaults_file }}"

    - name: "TIER-001-03: Deploy the retention unit from the shipped template"
      ansible.builtin.template:
        src: "{{ role_templates_dir }}/restic-prune.service.j2"
        dest: /etc/systemd/system/restic-prune.service
        mode: "0644"

    - name: "VERIFY-002-02: Deploy the integrity-check unit from the shipped template"
      ansible.builtin.template:
        src: "{{ role_templates_dir }}/restic-check.service.j2"
        dest: /etc/systemd/system/restic-check.service
        mode: "0644"

    - name: "TIER-001-03: Reload systemd so the rendered host units are visible"
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: "TIER-001-03: Expose the restic stub at restic_install_path for the host units"
      ansible.builtin.copy:
        src: "{{ shim_dir }}/restic"
        dest: /usr/local/bin/restic
        remote_src: true
        mode: "0755"

    - name: "TIER-001-03: Reset the restic stub log for the retention run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: The Tier1 retention unit runs (TIER-001-03)"
      ansible.builtin.command:
        cmd: systemctl start restic-prune.service
      register: tier1_retention_start
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier1 retention run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier1_retention_log
      changed_when: false
      failed_when: false

    - name: "THEN: Tier1 retention ran `restic forget --prune` (TIER-001-03)"
      ansible.builtin.assert:
        that:
          - "'forget' in tier1_retention_log.stdout"
          - "'--prune' in tier1_retention_log.stdout"
        fail_msg: >-
          The Tier1 cycle did not run retention (`restic forget --prune`).
          rc={{ tier1_retention_start.rc }}
          log={{ tier1_retention_log.stdout }}
        success_msg: "Tier1 retention ran restic forget --prune (TIER-001-03)"

    - name: "GIVEN: Ensure no restore-fail marker and clear prior restore evidence (TIER-001-03)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ shim_dir }}/restore-fail"
        - /var/lib/backup-restore-verify/evidence/chatwoot.json

    - name: "WHEN: The Tier1-asset restore-verification runner runs (TIER-001-03)"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-restore-verify-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier1_verify_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Stat the Tier1 restore evidence (TIER-001-03)"
      ansible.builtin.stat:
        path: /var/lib/backup-restore-verify/evidence/chatwoot.json
      register: tier1_verify_evidence

    - name: "THEN: Tier1 verification ran and recorded success evidence (TIER-001-03)"
      ansible.builtin.assert:
        that:
          - tier1_verify_run.rc == 0
          - tier1_verify_evidence.stat.exists
        fail_msg: >-
          The Tier1 verification leg did not run or record evidence
          (TIER-001-03). rc={{ tier1_verify_run.rc }}
          stderr={{ tier1_verify_run.stderr | default('') }}
        success_msg: "Tier1 restore verification ran and recorded evidence (TIER-001-03)"

    # ---------------------------------------------------------------------------
    # VERIFY-002-02 "Integrity failure visible": `restic-check.service` runs
    # `/usr/local/bin/restic check` with NO `|| true`, so a repository that fails
    # the integrity check leaves the systemd unit failed. That recorded unit
    # result (Result=exit-code / non-zero ExecMainStatus, visible in the journal)
    # is how the real code surfaces the failure. The stub gains a `check` branch
    # and a `check-fail` marker so this path is observable; the default (marker
    # absent) exits 0. Before the stub branch, `check` fell through to `exit 0`
    # and nothing could record a failure.
    # ---------------------------------------------------------------------------
    - name: "VERIFY-002-02: Force the stubbed `restic check` to fail"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/check-fail"
        content: "corrupt\n"
        mode: "0644"

    - name: "VERIFY-002-02: Clear any prior failed state on the check unit"
      ansible.builtin.command:
        cmd: systemctl reset-failed restic-check.service
      changed_when: false
      failed_when: false

    - name: "WHEN: The integrity-check unit runs against a failing repository (VERIFY-002-02)"
      ansible.builtin.command:
        cmd: systemctl start restic-check.service
      register: integrity_check_failed_start
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the recorded unit result after the failing check (VERIFY-002-02)"
      ansible.builtin.command:
        cmd: systemctl show -p Result --value restic-check.service
      register: integrity_check_failed_result
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the recorded exit status after the failing check (VERIFY-002-02)"
      ansible.builtin.command:
        cmd: systemctl show -p ExecMainStatus --value restic-check.service
      register: integrity_check_failed_status
      changed_when: false
      failed_when: false

    - name: "THEN: A failing integrity check is RECORDED and SURFACED, never swallowed (VERIFY-002-02)"
      ansible.builtin.assert:
        that:
          - integrity_check_failed_result.stdout | trim == 'exit-code'
          - integrity_check_failed_status.stdout | trim != '0'
        fail_msg: >-
          A failing `restic check` was swallowed by systemd:
          start_rc={{ integrity_check_failed_start.rc }}
          Result={{ integrity_check_failed_result.stdout | default('') | trim }}
          ExecMainStatus={{ integrity_check_failed_status.stdout | default('') | trim }}
        success_msg: "Failing integrity check recorded by systemd (Result=exit-code, non-zero status)"

    - name: "GIVEN: Clear the check-fail marker and the recorded failed state"
      ansible.builtin.file:
        path: "{{ shim_dir }}/check-fail"
        state: absent

    - name: "GIVEN: Reset the failed check unit before the healthy run"
      ansible.builtin.command:
        cmd: systemctl reset-failed restic-check.service
      changed_when: false
      failed_when: false

    - name: "WHEN: The integrity-check unit runs against a healthy repository (VERIFY-002-02)"
      ansible.builtin.command:
        cmd: systemctl start restic-check.service
      register: integrity_check_healthy_start
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the recorded unit result after the healthy check (VERIFY-002-02)"
      ansible.builtin.command:
        cmd: systemctl show -p Result --value restic-check.service
      register: integrity_check_healthy_result
      changed_when: false
      failed_when: false

    - name: "THEN: A healthy integrity check records success (VERIFY-002-02)"
      ansible.builtin.assert:
        that:
          - integrity_check_healthy_start.rc == 0
          - integrity_check_healthy_result.stdout | trim == 'success'
        fail_msg: >-
          A healthy `restic check` did not record success:
          start_rc={{ integrity_check_healthy_start.rc }}
          Result={{ integrity_check_healthy_result.stdout | default('') | trim }}
        success_msg: "Healthy integrity check recorded success (VERIFY-002-02)"

    # ---------------------------------------------------------------------------
    # TIER-002 (task 3.2): only declared volumes[] are backed up; an undeclared
    # volume reported by docker inspect is never touched.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Reset the restic stub log for the Tier2 opt-in run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the chatwoot runner (declared mount mismatch + undeclared volume)"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier2_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier2 run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier2_restic_log
      changed_when: false
      failed_when: false

    - name: "THEN: Undeclared and unmatched volumes are never tarred (TIER-002)"
      ansible.builtin.assert:
        that:
          - tier2_run.rc == 0
          - "'volume,chatwoot' not in tier2_restic_log.stdout"
          - "'undeclared_vol' not in tier2_restic_log.stdout"
        fail_msg: >-
          The engine backed up a volume that was not declared with a matching
          mount_path (TIER-002). log={{ tier2_restic_log.stdout }}
        success_msg: "Only declared volumes are backed up; undeclared volume untouched"

    # ---------------------------------------------------------------------------
    # TIER-003 (task 3.3): a tar abort MUST still unpause the container.
    # RED before the quiesce-library fix: the EXIT trap could not read the
    # function-local `paused` flag under `set -u`, leaving the container paused.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enable the tar-abort marker"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/tar-abort"
        content: "abort\n"
        mode: "0644"

    - name: "GIVEN: Remove any previous quiesce log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/quiesce.log"
        state: absent

    - name: "WHEN: Run the quiesce-app runner and the volume tar aborts"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-quiesce-app.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: quiesce_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the quiesce log"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/quiesce.log"
      register: quiesce_log
      changed_when: false
      failed_when: false

    - name: "THEN: The container is unpaused after a tar abort (TIER-003)"
      ansible.builtin.assert:
        that:
          - "'pause quiesce-app' in quiesce_log.stdout"
          - "'unpause quiesce-app' in quiesce_log.stdout"
        fail_msg: >-
          Container left PAUSED after the tar step aborted (TIER-003 violated).
          quiesce.log={{ quiesce_log.stdout }}
        success_msg: "Container unpaused after tar abort (TIER-003 satisfied)"

    - name: "GIVEN: Remove the tar-abort marker"
      ansible.builtin.file:
        path: "{{ shim_dir }}/tar-abort"
        state: absent

    # ---------------------------------------------------------------------------
    # TIER-002-01 / ENGINE-002-01 / ENGINE-003-02 / ENGINE-005-02 - TIER2 VOLUME
    # HAPPY PATH (positive coverage). Every other volume test is negative by
    # construction: the chatwoot fixture deliberately mismatches mount_path
    # (skip), and quiesce-app forces a tar abort. A regression that silently
    # dropped volume uploads would therefore still pass them all. This run proves
    # the tarball IS streamed into restic.
    #
    # quiesce-app declares volume `quiesce_data` at /app/qdata with
    # consistency=quiesce; the docker stub reports the REAL volume name `qvol` at
    # /app/qdata. resolve_volume() matches by mount_path, so the quiesce helper
    # tars and streams `${app}_${volume}_${timestamp}.tar.gz` with tag
    # `volume,${app}`. The resolved name (`qvol`) differs from the declared
    # profile name (`quiesce_data`), which is the ENGINE-003 runtime-resolution
    # proof: the name came from `docker inspect`, not from string-building.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Reset the restic stub log for the Tier2 volume HAPPY PATH run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "GIVEN: Ensure the tar-abort marker is absent (success path)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/tar-abort"
        state: absent

    - name: "WHEN: Run the quiesce-app runner with a MATCHING mount_path and no tar abort"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-quiesce-app.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: tier2_happy_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the Tier2 volume HAPPY PATH run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: tier2_happy_log
      changed_when: false
      failed_when: false

    - name: "THEN: A declared volume is tarred and STREAMED into restic (TIER-002-01/ENGINE-005-02)"
      ansible.builtin.assert:
        that:
          - tier2_happy_run.rc == 0
          - "'volume,quiesce-app' in tier2_happy_log.stdout"
          - >-
            (tier2_happy_log.stdout | default('')) is search(
            '--stdin-filename quiesce-app_qvol_[0-9]{8}_[0-9]{6}[.]tar[.]gz')
        fail_msg: >-
          A declared volume with a matching mount_path was NOT streamed into
          restic (TIER-002-01/ENGINE-005-02). rc={{ tier2_happy_run.rc }}
          log={{ tier2_happy_log.stdout }}
        success_msg: "Declared volume tarred and streamed into restic (TIER-002-01/ENGINE-005-02)"

    - name: "THEN: The declared database AND its volume are both backed up in one run (ENGINE-002-01)"
      ansible.builtin.assert:
        that:
          - "'db,postgresql,quiesce-app' in tier2_happy_log.stdout"
          - "'volume,quiesce-app' in tier2_happy_log.stdout"
        fail_msg: >-
          A profile declaring a database AND a volume did not back up both
          (ENGINE-002-01). log={{ tier2_happy_log.stdout }}
        success_msg: "Declared database and declared volume both backed up (ENGINE-002-01)"

    - name: "THEN: The resolved volume name came from docker inspect, not the declared name (ENGINE-003-02)"
      ansible.builtin.assert:
        that:
          - "'qvol' in tier2_happy_log.stdout"
          - "'quiesce_data' not in tier2_happy_log.stdout"
        fail_msg: >-
          The volume name was not the one reported by `docker inspect`
          (ENGINE-003-02): expected `qvol`, not the declared `quiesce_data`.
          log={{ tier2_happy_log.stdout }}
        success_msg: "Volume name resolved from docker inspect, not from the declared name (ENGINE-003-02)"

    # ---------------------------------------------------------------------------
    # ENGINE-003-01 - PROJECT-PREFIXED COMPOSE VOLUME. The spec's THEN is that
    # chatwoot's Compose volume `chatwoot_storage` is backed up under its resolved
    # `chatwoot_chatwoot_storage` name. The marker switches the docker stub's
    # chatwoot `inspect` output to that resolved name at the DECLARED
    # mount_path (/app/data); with the marker absent the stub keeps the literal
    # external name at a non-matching destination, so the negative test above is
    # untouched.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Simulate a project-prefixed Compose volume for chatwoot (ENGINE-003-01)"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/chatwoot-projectvol"
        content: "project-prefixed\n"
        mode: "0644"

    - name: "GIVEN: Reset the restic stub log for the project-prefixed run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the chatwoot runner with the project-prefixed volume reported"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: chatwoot_projectvol_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the project-prefixed run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: chatwoot_projectvol_log
      changed_when: false
      failed_when: false

    # The streamed name is `${APP}_${volume}_${TIMESTAMP}.tar.gz`
    # (backup-engine.sh.j2 backup_volume_live), so the resolved volume
    # `chatwoot_chatwoot_storage` appears as
    # `chatwoot_chatwoot_chatwoot_storage_<ts>.tar.gz`.
    - name: "THEN: The project-prefixed Compose volume is resolved and backed up (ENGINE-003-01)"
      ansible.builtin.assert:
        that:
          - chatwoot_projectvol_run.rc == 0
          - "'volume,chatwoot' in chatwoot_projectvol_log.stdout"
          - "'chatwoot_chatwoot_storage' in chatwoot_projectvol_log.stdout"
          - >-
            (chatwoot_projectvol_log.stdout | default('')) is search(
            '--stdin-filename chatwoot_chatwoot_chatwoot_storage_[0-9]{8}_[0-9]{6}[.]tar[.]gz')
        fail_msg: >-
          The project-prefixed Compose volume was not resolved and streamed
          (ENGINE-003-01). rc={{ chatwoot_projectvol_run.rc }}
          log={{ chatwoot_projectvol_log.stdout }}
        success_msg: "Project-prefixed volume resolved and streamed as chatwoot_chatwoot_storage (ENGINE-003-01)"

    - name: "GIVEN: Remove the project-prefixed volume marker (restore the negative case)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/chatwoot-projectvol"
        state: absent

    # ---------------------------------------------------------------------------
    # D6 DEPLOY-TIME HOST AFFINITY (Fix 3): the DB credential EnvironmentFile is
    # rendered ONLY when `resolve.yml` proved the container is present on this
    # host. RED before the fix: db_credentials.yml ran unconditionally and failed
    # on any pg_dump app whose container (and SOPS password) was absent here.
    # This setup re-runs the REAL deploy path with the container present so the
    # credential file exists for the CRED-003 assertions below.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Expose the docker stub as the real CLI for deploy-time inspect (Fix 3)"
      ansible.builtin.copy:
        src: "{{ shim_dir }}/docker"
        dest: /usr/bin/docker
        remote_src: true
        mode: "0755"

    - name: "GIVEN: Mark the app container present for deploy-time affinity (Fix 3)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    - name: "WHEN: Deploy the chatwoot profile with its container present (Fix 3)"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: deploy_from_profile.yml
      loop:
        - "{{ fixture_root }}/chatwoot/profile.yml"

    # ---------------------------------------------------------------------------
    # CRED-003 (task 3.4): per-app DB EnvironmentFile, 0600 root.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the rendered per-app DB credential file"
      ansible.builtin.stat:
        path: /etc/restic/db-chatwoot.env
      register: db_cred_file

    - name: "THEN: The per-app DB credential file is root-owned 0600 (CRED-003)"
      ansible.builtin.assert:
        that:
          - db_cred_file.stat.exists
          - db_cred_file.stat.pw_name == 'root'
          - db_cred_file.stat.mode == '0600'
        fail_msg: "/etc/restic/db-chatwoot.env missing or wrong ownership/mode (CRED-003)"
        success_msg: "/etc/restic/db-chatwoot.env is root-owned 0600"

    - name: "GIVEN: Read the rendered DB credential file"
      ansible.builtin.slurp:
        path: /etc/restic/db-chatwoot.env
      register: db_cred_content

    - name: "THEN: The credential file exports PGPASSWORD from SOPS (CRED-003)"
      ansible.builtin.assert:
        that:
          - "'PGPASSWORD=' in (db_cred_content.content | b64decode)"
        fail_msg: "Rendered DB credential file does not export PGPASSWORD"
        success_msg: "DB credential file exports PGPASSWORD"

    # ---------------------------------------------------------------------------
    # CRED-003/004 (task 3.5): the password never reaches a command line or
    # `docker inspect` output, nor the rendered runner itself.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Reset the docker argv log"
      ansible.builtin.file:
        path: "{{ shim_dir }}/docker.log"
        state: absent

    - name: "WHEN: Run the chatwoot runner with the sentinel password set"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: leak_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the docker argv log"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/docker.log"
      register: docker_argv_log
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the rendered chatwoot runner"
      ansible.builtin.slurp:
        path: /usr/local/bin/backup-engine-chatwoot.sh
      register: chatwoot_runner_content

    - name: "THEN: The sentinel password never appears in any docker argv or the runner (CRED-003)"
      ansible.builtin.assert:
        that:
          - "'LEAKCANARY_chatwoot_pw' not in docker_argv_log.stdout"
          - "'LEAKCANARY_chatwoot_pw' not in (chatwoot_runner_content.content | b64decode)"
        fail_msg: >-
          The DB password leaked onto a docker command line or into the rendered
          runner (CRED-003). argv={{ docker_argv_log.stdout }}
        success_msg: "No password on any docker command line or in the runner"

    - name: "WHEN: Inspect the container with docker inspect"
      ansible.builtin.command:
        cmd: docker inspect chatwoot
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: docker_inspect_out
      changed_when: false
      failed_when: false

    - name: "THEN: docker inspect output carries no password (CRED-004)"
      ansible.builtin.assert:
        that:
          - "'LEAKCANARY_chatwoot_pw' not in (docker_inspect_out.stdout | default(''))"
        fail_msg: "The DB password appeared in docker inspect output (CRED-004)"
        success_msg: "docker inspect output carries no password"

    # ---------------------------------------------------------------------------
    # CRED-005 (task 3.6): no secret is passed with `-e NAME="value"` on any
    # ephemeral-container command line.
    # ---------------------------------------------------------------------------
    - name: "THEN: Assert no -e secret on the retention/backup command lines (CRED-005)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e RESTIC_PASSWORD="')
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e AWS_SECRET_ACCESS_KEY="')
          - (lookup('file', role_tasks_dir + '/retention.yml')) is not search('-e AWS_ACCESS_KEY_ID="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e RESTIC_PASSWORD="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e AWS_SECRET_ACCESS_KEY="')
          - (lookup('file', role_tasks_dir + '/restic_backup.yml')) is not search('-e AWS_ACCESS_KEY_ID="')
        fail_msg: "A backup password is still passed via -e on a command line (CRED-005)"
        success_msg: "No secret passed via -e on any command line (CRED-005)"

    # ---------------------------------------------------------------------------
    # CRED-001/002 fail-loud (Fix 3): a PRESENT container with a missing/empty
    # SOPS password must STILL fail the deploy. Only the absent-container case
    # becomes a skip.
    # ---------------------------------------------------------------------------
    - name: "THEN: A present container with a missing SOPS password fails loudly (Fix 3)"
      block:
        - name: "WHEN: Deploy the absent-db profile with its container present and no password"
          ansible.builtin.include_role:
            name: L6_runtime/backup
            tasks_from: deploy_from_profile.yml
          loop:
            - "{{ fixture_root }}/absent-db/profile.yml"

        - name: "THEN: A missing credential MUST have failed the deploy (CRED-001/002)"
          ansible.builtin.fail:
            msg: "A present container with a missing SOPS password did not fail - CRED-001/002 violated"
      rescue:
        - name: "THEN: The failure names the missing SOPS key (CRED-001/002)"
          ansible.builtin.assert:
            that:
              - "'backup_db_absent_db_password' in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              The fail-loud path did not report the missing SOPS key
              (msg={{ ansible_failed_result.msg | default('') }}).
            success_msg: "Present container + missing password fails naming the SOPS key (CRED-001/002)"

    # ---------------------------------------------------------------------------
    # D6 host affinity (Fix 3): an ABSENT container deploys the pg_dump profile
    # without requiring its SOPS password and renders no credential file.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Remove the container-present marker (absent container)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: absent

    - name: "THEN: An absent container deploys without its SOPS password (Fix 3)"
      block:
        - name: "WHEN: Deploy the absent-db profile with its container absent"
          ansible.builtin.include_role:
            name: L6_runtime/backup
            tasks_from: deploy_from_profile.yml
          loop:
            - "{{ fixture_root }}/absent-db/profile.yml"
      rescue:
        - name: "THEN: An absent-container deploy MUST NOT fail on the credential assert (Fix 3)"
          ansible.builtin.fail:
            msg: >-
              Absent-container deploy failed (host affinity broken):
              {{ ansible_failed_result.msg | default('') }}

    - name: "THEN: Stat the credential file for the absent-container app (Fix 3)"
      ansible.builtin.stat:
        path: /etc/restic/db-absent-db.env
      register: absent_db_cred

    - name: "THEN: No credential file is rendered for an absent-container app (Fix 3)"
      ansible.builtin.assert:
        that:
          - not absent_db_cred.stat.exists
        fail_msg: "/etc/restic/db-absent-db.env exists for an absent container (host affinity violated)"
        success_msg: "No credential file rendered for the absent-container app (Fix 3)"

    - name: "GIVEN: Restore the container-present marker for later runtime tests"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    # ---------------------------------------------------------------------------
    # ClickHouse adapter (task 4.7 / design Open Q2): when `clickhouse-backup`
    # is absent, the engine MUST fall back to `clickhouse-client BACKUP` and
    # still stream the archive into restic (ENGINE-005).
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Mark clickhouse-backup ABSENT in the stub container"
      ansible.builtin.file:
        path: "{{ shim_dir }}/ch-no-binary"
        state: touch
        mode: "0644"

    - name: "GIVEN: Reset the restic stub log for the ClickHouse fallback run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "WHEN: Run the clickhouse engine runner with clickhouse-backup absent"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-engine-clickhouse.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: ch_fallback_run
      changed_when: false
      failed_when: false

    - name: "GIVEN: Read the restic stub log after the ClickHouse run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: ch_fallback_log
      changed_when: false
      failed_when: false

    - name: "THEN: The clickhouse-client BACKUP fallback streamed into restic (4.7)"
      ansible.builtin.assert:
        that:
          - ch_fallback_run.rc == 0
          - "'clickhouse-client BACKUP' in (ch_fallback_run.stderr | default(''))"
          - "'db,clickhouse,clickhouse' in ch_fallback_log.stdout"
        fail_msg: >-
          ClickHouse adapter did not fall back to clickhouse-client BACKUP and
          stream to restic (rc={{ ch_fallback_run.rc }}).
          log={{ ch_fallback_log.stdout }}
        success_msg: "ClickHouse fell back to clickhouse-client BACKUP and streamed to restic"

    - name: "GIVEN: Remove the clickhouse-backup-absent marker"
      ansible.builtin.file:
        path: "{{ shim_dir }}/ch-no-binary"
        state: absent

    # ---------------------------------------------------------------------------
    # APP-PROFILE-SCHEMA-004 (tasks 4.1-4.8): the SHIPPED apps/*/profile.yml
    # declarations. Molecule converges fixtures, so this section reads the real
    # profiles from the control node and validates the shipped schema directly:
    # databases[] requires db_name + user and no password (004-03); volumes[]
    # requires name + mount_path + consistency in {quiesce, live} (004-04).
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Enumerate the shipped app profiles (004)"
      ansible.builtin.find:
        paths: "{{ playbook_dir }}/../../apps"
        patterns: "profile.yml"
        recurse: true
      delegate_to: localhost
      become: false
      register: real_profile_files

    - name: "GIVEN: Load each shipped app profile (004)"
      ansible.builtin.include_vars:
        file: "{{ item.path }}"
        name: _real
      loop: "{{ real_profile_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: real_profiles

    - name: "THEN: Shipped profiles satisfy the 004 schema contract (004-03/-04)"
      ansible.builtin.assert:
        that:
          - (p.backup.databases | default([])) | selectattr('db_name', 'undefined') | list | length == 0
          - (p.backup.databases | default([])) | selectattr('user', 'undefined') | list | length == 0
          - (p.backup.databases | default([])) | selectattr('password', 'defined') | list | length == 0
          - (p.backup.volumes | default([])) | selectattr('name', 'undefined') | list | length == 0
          - (p.backup.volumes | default([])) | selectattr('mount_path', 'undefined') | list | length == 0
          - (p.backup.volumes | default([])) | rejectattr('consistency', 'in', ['quiesce', 'live']) | list | length == 0
        fail_msg: >-
          Shipped profile '{{ item.item.path | dirname | basename }}' violates
          APP-PROFILE-SCHEMA-004: databases[] requires db_name + user with no
          password; volumes[] requires name + mount_path + consistency in
          {quiesce, live}.
        success_msg: "Shipped profile '{{ item.item.path | dirname | basename }}' satisfies APP-PROFILE-SCHEMA-004"
      loop: "{{ real_profiles.results }}"
      loop_control:
        label: "{{ item.item.path | dirname | basename }}"
      vars:
        p: "{{ item.ansible_facts._real }}"
      when:
        - item.ansible_facts is defined
        - item.ansible_facts._real is defined
        - item.ansible_facts._real.backup is defined

    - name: "GIVEN: Load the shipped n8n / uptime-kuma / openlit / chatwoot profiles (004)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../apps/{{ item.app }}/profile.yml"
        name: "{{ item.var }}"
      loop:
        - { app: n8n, var: real_n8n }
        - { app: uptime-kuma, var: real_uptime_kuma }
        - { app: openlit, var: real_openlit }
        - { app: chatwoot, var: real_chatwoot }
      loop_control:
        label: "{{ item.app }}"

    - name: "THEN: n8n backup block matches the dump-based theme (004-01)"
      ansible.builtin.assert:
        that:
          - real_n8n.backup.method == 'pg_dump'
          - real_n8n.backup.schedule == '*-*-* 00/4:00:00'
          - real_n8n.backup.retention_daily == 7
          - real_n8n.backup.retention_weekly == 4
          - real_n8n.backup.retention_monthly == 12
          - real_n8n.backup.verification == 'monthly-restore-test'
          - real_n8n.backup.db_type is defined
          - real_n8n.backup.db_name is defined
          - real_n8n.backup.volumes | map(attribute='name') | list == ['n8n_data']
          - real_n8n.backup.volumes | map(attribute='mount_path') | list == ['/home/node/.n8n']
        fail_msg: "n8n profile does not match APP-PROFILE-SCHEMA-004-01"
        success_msg: "n8n declares pg_dump + retention + db_type/db_name + n8n_data volume (004-01)"

    - name: "THEN: uptime-kuma and openlit are file-volume with tier-appropriate verification (004-02)"
      ansible.builtin.assert:
        that:
          - real_uptime_kuma.backup.method == 'file-volume'
          - real_uptime_kuma.backup.verification == 'quarterly-restore-test'
          - real_openlit.backup.method == 'file-volume'
          - real_openlit.backup.verification == 'none'
        fail_msg: "uptime-kuma/openlit do not match APP-PROFILE-SCHEMA-004-02"
        success_msg: "uptime-kuma quarterly / openlit none, both file-volume (004-02)"

    - name: "THEN: chatwoot declares a password-free database entry (004-03)"
      ansible.builtin.assert:
        that:
          - real_chatwoot.backup.databases | length == 1
          - real_chatwoot.backup.databases | map(attribute='db_name') | list == ['chatwoot']
          - real_chatwoot.backup.databases | map(attribute='user') | list | length == 1
          - real_chatwoot.backup.databases | selectattr('password', 'defined') | list | length == 0
        fail_msg: "chatwoot databases[] must declare db_name + user and no password (004-03)"
        success_msg: "chatwoot declares db_name chatwoot + backup user, no password (004-03)"

    - name: "THEN: chatwoot declares a well-formed volume entry (004-04)"
      ansible.builtin.assert:
        that:
          - real_chatwoot.backup.volumes | map(attribute='name') | list == ['chatwoot_storage']
          - real_chatwoot.backup.volumes | map(attribute='mount_path') | list == ['/app/storage']
          - real_chatwoot.backup.volumes | map(attribute='consistency') | list == ['live']
        fail_msg: "chatwoot volumes[] must declare name + mount_path + consistency (004-04)"
        success_msg: "chatwoot volume declares name/mount_path/consistency (004-04)"

    # ---------------------------------------------------------------------------
    # APP-PROFILE-SCHEMA-004-05: an invalid `consistency` MUST be rejected before
    # any unit render. RED before the validation gate: the profile is accepted and
    # a unit is written, so the explicit `fail` below trips and the rescue assert
    # (no unit on disk) fails. GREEN after the gate: the assert rejects the entry
    # and no unit exists.
    # ---------------------------------------------------------------------------
    - name: "THREAT: invalid volume consistency is rejected before render (004-05)"
      block:
        - name: "WHEN: The role processes a profile declaring consistency: eventual"
          ansible.builtin.include_role:
            name: L6_runtime/backup
            tasks_from: deploy_from_profile.yml
          loop:
            - "{{ playbook_dir }}/fixtures/threat/bad-consistency/profile.yml"

        - name: "THEN: An invalid consistency MUST have been rejected (004-05)"
          ansible.builtin.fail:
            msg: "consistency: eventual was accepted - APP-PROFILE-SCHEMA-004-05 violated"
      rescue:
        - name: "THEN: Stat the unit for the invalid-consistency profile"
          ansible.builtin.stat:
            path: "/etc/systemd/system/backup-engine-bad-consistency.timer"
          register: bad_consistency_timer

        - name: "THEN: Assert no invalid-consistency unit exists on disk (004-05)"
          ansible.builtin.assert:
            that:
              - not bad_consistency_timer.stat.exists
            fail_msg: "A unit was deployed despite consistency: eventual - 004-05 violated"
            success_msg: "consistency: eventual rejected before any unit render (004-05)"

    # ---------------------------------------------------------------------------
    # VERIFY-001 / task 5.4 (RED gate): a completed restore MUST persist an
    # evidence JSON. RED before the runner exists: the runner is absent, no
    # evidence is written and the evidence assertion fails. GREEN after the
    # runner writes success/failure evidence.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Mark the app container present for the restore drill"
      ansible.builtin.file:
        path: "{{ shim_dir }}/container-present"
        state: touch
        mode: "0644"

    - name: "GIVEN: Ensure no restore-fail marker and clear any prior evidence"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ shim_dir }}/restore-fail"
        - /var/lib/backup-restore-verify/evidence/chatwoot.json

    - name: "WHEN: The restore-verification runner completes a restore (VERIFY-001)"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-restore-verify-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: restore_verify_success
      changed_when: false
      failed_when: false

    - name: "GIVEN: Stat the success restore evidence JSON (VERIFY-001)"
      ansible.builtin.stat:
        path: /var/lib/backup-restore-verify/evidence/chatwoot.json
      register: restore_evidence_success

    - name: "THEN: A completed restore writes an evidence JSON (VERIFY-001/5.4)"
      ansible.builtin.assert:
        that:
          - restore_evidence_success.stat.exists
        fail_msg: >-
          No restore evidence JSON was written after a completed restore
          (VERIFY-001). runner_rc={{ restore_verify_success.rc | default('?') }}
          stderr={{ restore_verify_success.stderr | default('') }}
        success_msg: "Restore evidence JSON written after a completed restore"

    - name: "THEN: The successful restore exits 0 (VERIFY-001)"
      ansible.builtin.assert:
        that:
          - restore_verify_success.rc == 0
        fail_msg: "Restore-verification runner failed on the success path (rc={{ restore_verify_success.rc }})"
        success_msg: "Restore-verification runner completed a restore successfully"

    - name: "GIVEN: Read the success evidence JSON"
      ansible.builtin.slurp:
        path: /var/lib/backup-restore-verify/evidence/chatwoot.json
      register: restore_evidence_success_content

    - name: "THEN: The success evidence records app + policy + result=success (VERIFY-001)"
      ansible.builtin.assert:
        that:
          - "'\"app\":\"chatwoot\"' in (restore_evidence_success_content.content | b64decode)"
          - "'\"verification\":\"monthly-restore-test\"' in (restore_evidence_success_content.content | b64decode)"
          - "'\"result\":\"success\"' in (restore_evidence_success_content.content | b64decode)"
        fail_msg: "Success evidence JSON is missing required fields (VERIFY-001)"
        success_msg: "Success evidence JSON records app + policy + result=success"

    # ---------------------------------------------------------------------------
    # VERIFY-004 (task 5.3): a failed verification propagates a non-zero exit,
    # writes failure evidence and notifies the operator.
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Force the stub restore to fail and clear the prior evidence"
      ansible.builtin.copy:
        dest: "{{ shim_dir }}/restore-fail"
        content: "fail\n"
        mode: "0644"

    - name: "GIVEN: Remove the success evidence so the failure write is isolated"
      ansible.builtin.file:
        path: /var/lib/backup-restore-verify/evidence/chatwoot.json
        state: absent

    - name: "GIVEN: Reset the curl notification logs"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ shim_dir }}/curl.log"
        - "{{ shim_dir }}/curl-stdin.log"

    - name: "WHEN: The restore-verification runner hits a failed restore (VERIFY-004)"
      ansible.builtin.command:
        cmd: /usr/local/bin/backup-restore-verify-chatwoot.sh
      environment:
        PATH: "{{ shim_dir }}:{{ ansible_env.PATH }}"
      register: restore_verify_failure
      changed_when: false
      failed_when: false

    - name: "THEN: A failed restore propagates a non-zero exit (VERIFY-004)"
      ansible.builtin.assert:
        that:
          - restore_verify_failure.rc != 0
        fail_msg: "A failed restore did not propagate a non-zero exit (VERIFY-004)"
        success_msg: "Failed restore propagated a non-zero exit"

    - name: "GIVEN: Read the failure evidence JSON"
      ansible.builtin.slurp:
        path: /var/lib/backup-restore-verify/evidence/chatwoot.json
      register: restore_evidence_failure_content

    - name: "THEN: The failure writes result=failure evidence (VERIFY-001/5.4)"
      ansible.builtin.assert:
        that:
          - "'\"result\":\"failure\"' in (restore_evidence_failure_content.content | b64decode)"
        fail_msg: "A failed restore did not write failure evidence (VERIFY-001)"
        success_msg: "Failure evidence JSON written with result=failure"

    - name: "GIVEN: Read the curl notification config"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/curl-stdin.log"
      register: restore_notify_config
      changed_when: false
      failed_when: false

    - name: "THEN: A failed verification emits an operator notification (VERIFY-004)"
      ansible.builtin.assert:
        that:
          - "'sendMessage' in (restore_notify_config.stdout | default(''))"
        fail_msg: "No operator notification was emitted on verification failure (VERIFY-004)"
        success_msg: "Operator notification emitted on verification failure"

    - name: "GIVEN: Read the curl argv log"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/curl.log"
      register: restore_notify_argv
      changed_when: false
      failed_when: false

    - name: "THEN: The Telegram token is never placed on the curl command line (CRED-003)"
      ansible.builtin.assert:
        that:
          - "'molecule-test-bot-token' not in (restore_notify_argv.stdout | default(''))"
        fail_msg: "The Telegram token appeared on the curl command line (CRED-003)"
        success_msg: "Telegram token passed via stdin config, never on argv"

    - name: "GIVEN: Remove the restore-fail marker"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restore-fail"
        state: absent

    # ---------------------------------------------------------------------------
    # VERIFY-003 (task 5.2): verification frequency follows the asset tier. The
    # restore-verification timer is derived from the profile's declared
    # `backup.verification` policy: monthly for Tier1, quarterly for Tier2, and
    # no unit at all for `none` (Tier3).
    # ---------------------------------------------------------------------------
    - name: "GIVEN: Stat the Tier1 monthly / Tier2 quarterly / none restore-verification timers (VERIFY-003)"
      ansible.builtin.stat:
        path: "/etc/systemd/system/backup-restore-verify-{{ item.app }}.timer"
      loop:
        - { app: chatwoot, tier: tier1 }
        - { app: uptime-kuma, tier: tier2 }
        - { app: openlit, tier: tier3 }
      register: verify_timer_stats

    - name: "THEN: Tier1 + Tier2 get a verification timer, verification: none gets none (VERIFY-003)"
      ansible.builtin.assert:
        that:
          - verify_timer_stats.results[0].stat.exists
          - verify_timer_stats.results[1].stat.exists
          - not verify_timer_stats.results[2].stat.exists
        fail_msg: >-
          Restore-verification timers do not follow the tier policy:
          tier1={{ verify_timer_stats.results[0].stat.exists }}
          tier2={{ verify_timer_stats.results[1].stat.exists }}
          tier3={{ verify_timer_stats.results[2].stat.exists }}
        success_msg: "Tier1 monthly + Tier2 quarterly verification timers deployed; none skipped"

    - name: "GIVEN: Slurp the monthly and quarterly restore-verification timers (VERIFY-003)"
      ansible.builtin.slurp:
        path: "/etc/systemd/system/backup-restore-verify-{{ item }}.timer"
      loop:
        - chatwoot
        - uptime-kuma
      register: verify_timer_contents

    - name: "THEN: The timer cadence matches the declared tier policy (VERIFY-003)"
      ansible.builtin.assert:
        that:
          - "'OnCalendar=*-*-01 04:00:00' in (verify_timer_contents.results[0].content | b64decode)"
          - "'OnCalendar=*-01,04,07,10-01 04:00:00' in (verify_timer_contents.results[1].content | b64decode)"
        fail_msg: "Restore-verification timers do not encode the tier cadence (VERIFY-003)"
        success_msg: "Monthly + quarterly restore-verification cadences rendered (VERIFY-003)"

    # ===========================================================================
    # PHASE 6 - MIGRATION + GATES (tasks 6.1-6.7)
    # The on-host gates (restic snapshots on brain-1/muscle-1, restore evidence
    # on real data) are operator-run; see docs/operations/BACKUP_MIGRATION_RUNBOOK.md.
    # The assertions below prove the IMPLEMENTABLE contract of this slice:
    #   * one credential namespace (STORAGE-005) + resolved endpoint (STORAGE-004)
    #   * inventory_hostname host key for passwords and the app-data repo (D4)
    #   * no re-init (marker guard) and the app-data seed source (D1/6.5)
    #   * the divergent-host fallback (open Q1/6.4)
    #   * the migration/rollback runbook ships (6.6/6.7)
    # ===========================================================================

    # 6.1 / STORAGE-005: no code consumes the legacy backup_r2_* / vault_* names.
    # The patterns are anchored to uncommented YAML keys (multiline), so the
    # transition-note COMMENTS that mention the retired names do not trip the gate.
    - name: "GATE 6.1: The legacy R2 namespace has no code consumers (STORAGE-005)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_defaults_file)) is not search('^\s*backup_r2_access_key_id\s*:', multiline=True)
          - (lookup('file', role_defaults_file)) is not search('^\s*vault_backup_r2_', multiline=True)
          - (lookup('file', group_vars_main_file)) is not search('^\s*backup_r2_endpoint\s*:', multiline=True)
        fail_msg: >-
          A legacy backup_r2_* / vault_backup_r2_* alias is still consumed in
          code (STORAGE-005). The single credential namespace is restic_r2_*.
        success_msg: "No legacy R2 namespace consumer remains in code (STORAGE-005)"

    # 6.1 / STORAGE-004: the repo base URL is built from restic_r2_* only.
    - name: "GATE 6.1: The repo base URL resolves from restic_r2_* (STORAGE-004)"
      ansible.builtin.assert:
        that:
          - (lookup('file', group_vars_main_file)) is search('restic_r2_endpoint')
          - (lookup('file', group_vars_main_file)) is search('backup_repo_base_url')
        fail_msg: "backup_repo_base_url does not resolve from restic_r2_endpoint (STORAGE-004)"
        success_msg: "Repo base URL resolves from restic_r2_* (STORAGE-004)"

    # 6.2 / D4: every password lookup is keyed by inventory_hostname.
    - name: "GATE 6.2: Password lookups use inventory_hostname, not ansible_hostname (D4)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_tasks_dir + '/credentials.yml')) is not search("restic_password_' ~ ansible_hostname")
          - (lookup('file', role_tasks_dir + '/credentials.yml')) is search("restic_password_' ~ inventory_hostname")
          - (lookup('file', role_tasks_dir + '/repo-init.yml')) is not search("restic_password_' ~ ansible_hostname")
          - (lookup('file', role_tasks_dir + '/repo-init.yml')) is search("restic_password_' ~ inventory_hostname")
          - (lookup('file', role_templates_dir + '/restic-run-env.j2')) is not search("restic_password_' ~ ansible_hostname")
          - (lookup('file', role_templates_dir + '/restic-run-env.j2')) is search("restic_password_' ~ inventory_hostname")
          - (lookup('file', role_templates_dir + '/restic-retention-env.j2')) is not search("restic_password_' ~ ansible_hostname")
          - (lookup('file', role_templates_dir + '/restic-retention-env.j2')) is search("restic_password_' ~ inventory_hostname")
        fail_msg: "A password lookup is still keyed by ansible_hostname (D4)"
        success_msg: "All password lookups keyed by inventory_hostname (D4)"

    # 6.2 / D4: the no-re-init contract is expressed as an existence guard.
    - name: "GATE 6.2: R2 init is marker-guarded, never unconditional (D4)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_tasks_dir + '/repo-init.yml')) is search('/etc/restic/.repo-initialized')
          - (lookup('file', role_tasks_dir + '/repo-init.yml')) is search('repo_init_marker.stat.exists')
        fail_msg: "repo-init.yml does not guard `restic init` behind the marker (D4 no-re-init)"
        success_msg: "restic init is marker-guarded (D4 no-re-init)"

    # 6.4 / open Q1: the divergent-host copy falls back to the stack-config repo.
    - name: "GATE 6.4: Divergent host resolves to the stack-config repo (open Q1)"
      ansible.builtin.assert:
        that:
          - (lookup('file', role_tasks_dir + '/repo-init-local.yml')) is search('_repo_init_host_key_divergent')
          - (lookup('file', role_tasks_dir + '/repo-init-local.yml')) is search('ansible_hostname != inventory_hostname')
          - (lookup('file', role_tasks_dir + '/repo-init-local.yml')) is search('_repo_init_copy_source')
        fail_msg: "repo-init-local.yml does not resolve the ansible_hostname/inventory_hostname divergence (open Q1)"
        success_msg: "Divergent-host guard resolves the seed source explicitly (open Q1)"

    # ---------------------------------------------------------------------------
    # GATE 6.5 (RED -> GREEN): the local second medium seeds from the APP-DATA
    # repo `restic/<host>`, NOT the stack-config repo. RED before the fix: the
    # copy source was restic_repo_url (stack-restic) and the seed-source
    # assertion below fails. GREEN after: --from-repo is restic_appdata_repo_url.
    # The second run proves the marker semantics are preserved (idempotence).
    # ---------------------------------------------------------------------------
    - name: "GATE 6.5: Create the R2 init marker so no re-init can occur (D4)"
      ansible.builtin.file:
        path: /etc/restic/.repo-initialized
        state: touch
        mode: "0600"

    # The extracted local seed now probes the source repo read-only first. Mark
    # the app-data source reachable so the stack-path seed still copies from it.
    - name: "GATE 6.5: Mark the app-data source repo reachable for the seed probe (D1)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: touch
        mode: "0644"

    - name: "GATE 6.5: Ensure the local repo directory exists (D1)"
      ansible.builtin.file:
        path: "/var/backups/restic/{{ inventory_hostname }}"
        state: directory
        mode: "0700"

    - name: "GATE 6.5: Pre-create the local repo config so only the seed runs (D1)"
      ansible.builtin.file:
        path: "/var/backups/restic/{{ inventory_hostname }}/config"
        state: touch
        mode: "0600"

    - name: "GATE 6.5: Remove the local seed marker to force exactly one seed run"
      ansible.builtin.file:
        path: /etc/restic/.local-seed-complete
        state: absent

    - name: "GATE 6.5: Reset the restic stub log for the seed run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    # repo-init.yml invokes bare `restic` (no PATH override), so expose the stub
    # on the default PATH for this test. The real restic binary is not installed
    # in the Molecule container (backup_engine_install_restic defaults false).
    - name: "GATE 6.5: Expose the restic stub on the default PATH"
      ansible.builtin.copy:
        src: "{{ shim_dir }}/restic"
        dest: /usr/local/bin/restic
        remote_src: true
        mode: "0755"

    - name: "GATE 6.5: Run repo-init (stack path) with the stubbed restic"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init.yml

    - name: "GATE 6.5: Read the restic stub log after the first seed"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: repo_init_first_log
      changed_when: false
      failed_when: false

    - name: "GATE 6.5: The seed copy sources the APP-DATA repo, not the stack repo (D1)"
      ansible.builtin.assert:
        that:
          - "'copy' in repo_init_first_log.stdout"
          - "'--from-repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in repo_init_first_log.stdout"
          - "'--from-repo ' ~ backup_repo_base_url ~ '/stack-restic/' not in repo_init_first_log.stdout"
        fail_msg: >-
          The local second medium was seeded from the wrong repository (D1).
          Expected --from-repo {{ backup_repo_base_url }}/restic/{{ inventory_hostname }}.
          log={{ repo_init_first_log.stdout }}
        success_msg: "Local second medium seeded from the app-data repo (D1/6.5)"

    - name: "GATE 6.5: No R2 re-init occurred (marker honoured, D4)"
      ansible.builtin.assert:
        that:
          - "'init --repo ' ~ backup_repo_base_url ~ '/stack-restic/' not in repo_init_first_log.stdout"
        fail_msg: "repo-init re-initialized the R2 repo despite the marker (D4)"
        success_msg: "No R2 re-init: the marker guard held (D4)"

    - name: "GATE 6.5: Stat the local seed marker after the copy"
      ansible.builtin.stat:
        path: /etc/restic/.local-seed-complete
      register: local_seed_marker_after

    - name: "GATE 6.5: The seed marker is written after a successful copy (D1)"
      ansible.builtin.assert:
        that:
          - local_seed_marker_after.stat.exists
        fail_msg: "The local seed marker was not written after the copy (D1)"
        success_msg: "Local seed marker written after the copy (D1)"

    - name: "GATE 6.5: Reset the restic stub log for the idempotence run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "GATE 6.5: Re-run repo-init with the seed marker present"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init.yml

    - name: "GATE 6.5: Read the restic stub log after the second run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: repo_init_second_log
      changed_when: false
      failed_when: false

    - name: "GATE 6.5: The second run performs no copy and no init (marker idempotence, D1)"
      ansible.builtin.assert:
        that:
          - "'copy' not in repo_init_second_log.stdout"
          - "'init' not in repo_init_second_log.stdout"
        fail_msg: >-
          repo-init is not idempotent: a second run re-copied or re-initialized.
          log={{ repo_init_second_log.stdout }}
        success_msg: "repo-init is idempotent on the second run (markers honoured)"

    # ---------------------------------------------------------------------------
    # FIX 4 (virgin-host gap): the APP-DATA repo restic/<inventory_hostname> is
    # the target of every engine runner, yet no code path ever initialized it.
    # repo-init-appdata.yml probes read-only, inits only when absent, and never
    # re-initializes an existing repo (D4 no-re-init).
    # ---------------------------------------------------------------------------
    - name: "FIX 4: Ensure the stubbed restic is at restic_install_path"
      ansible.builtin.copy:
        src: "{{ shim_dir }}/restic"
        dest: /usr/local/bin/restic
        remote_src: true
        mode: "0755"

    - name: "FIX 4: Simulate a virgin app-data repo (probe fails, no repo)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: absent

    - name: "FIX 4: Reset the restic stub log for the app-data init run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "FIX 4: Initialize the app-data repo on a virgin host"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init-appdata.yml

    - name: "FIX 4: Read the restic stub log after the app-data init"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: appdata_init_log
      changed_when: false
      failed_when: false

    - name: "FIX 4: A virgin host probes, inits and verifies the APP-DATA repo"
      ansible.builtin.assert:
        that:
          - "'cat config --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in appdata_init_log.stdout"
          - "'init --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in appdata_init_log.stdout"
          - "'stats --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in appdata_init_log.stdout"
        fail_msg: >-
          repo-init-appdata did not probe+init+verify the app-data repo on a
          virgin host. log={{ appdata_init_log.stdout }}
        success_msg: "Virgin host initialized and verified the app-data repo (Fix 4)"

    - name: "FIX 4: Mark the app-data repo as existing (post-init)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: touch
        mode: "0644"

    - name: "FIX 4: Reset the restic stub log for the no-re-init run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "FIX 4: Re-run the app-data init against the existing repo"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init-appdata.yml

    - name: "FIX 4: Read the restic stub log after the no-re-init run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: appdata_reinit_log
      changed_when: false
      failed_when: false

    - name: "FIX 4: An existing app-data repo is never re-initialized (D4)"
      ansible.builtin.assert:
        that:
          - "'init --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname not in appdata_reinit_log.stdout"
          - "'cat config --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in appdata_reinit_log.stdout"
        fail_msg: >-
          repo-init-appdata re-initialized an existing repo - every snapshot
          would be orphaned (D4). log={{ appdata_reinit_log.stdout }}
        success_msg: "Existing app-data repo probed, never re-initialized (D4)"

    # ---------------------------------------------------------------------------
    # LOCAL SEED (D1/STORAGE-006): the ENGINE path must also create and seed the
    # local second medium /var/backups/restic/<host>, not only the stack path.
    # repo-init-local.yml probes the source repo read-only, inits the local repo
    # with the source chunker params, seeds it via `restic copy`, and writes
    # /etc/restic/.local-seed-complete. A second run is a no-op; an unavailable
    # source skips without failing and without writing the marker.
    # ---------------------------------------------------------------------------
    - name: "LOCAL SEED: Ensure the stubbed restic is on PATH (D1)"
      ansible.builtin.copy:
        src: "{{ shim_dir }}/restic"
        dest: /usr/local/bin/restic
        remote_src: true
        mode: "0755"

    - name: "LOCAL SEED: Mark the app-data source repo reachable (D1)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: touch
        mode: "0644"

    - name: "LOCAL SEED: Force a virgin local repo and no seed marker (D1)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/backups/restic/{{ inventory_hostname }}/config"
        - /etc/restic/.local-seed-complete

    - name: "LOCAL SEED: Reset the restic stub log for the engine seed run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "LOCAL SEED: Run the engine-path local seed with the stubbed restic (D1)"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init-local.yml

    - name: "LOCAL SEED: Read the restic stub log after the engine seed"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: local_seed_engine_log
      changed_when: false
      failed_when: false

    - name: "LOCAL SEED: The engine path probes, inits and seeds from APP-DATA (D1)"
      ansible.builtin.assert:
        that:
          - "'cat config --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in local_seed_engine_log.stdout"
          - "'init --repo /var/backups/restic/' ~ inventory_hostname in local_seed_engine_log.stdout"
          - "'--from-repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in local_seed_engine_log.stdout"
          - "'--copy-chunker-params' in local_seed_engine_log.stdout"
          - "'copy --repo /var/backups/restic/' ~ inventory_hostname in local_seed_engine_log.stdout"
        fail_msg: >-
          The engine path did not create and seed the local second medium from
          the app-data repo (D1). log={{ local_seed_engine_log.stdout }}
        success_msg: "Engine path probed + initialized + seeded the local second medium from the app-data repo (D1)"

    - name: "LOCAL SEED: Stat the local repo directory after the engine seed (D1)"
      ansible.builtin.stat:
        path: "/var/backups/restic/{{ inventory_hostname }}"
      register: local_seed_engine_dir

    - name: "LOCAL SEED: Stat the seed marker after the engine seed (D1)"
      ansible.builtin.stat:
        path: /etc/restic/.local-seed-complete
      register: local_seed_marker_after_engine

    - name: "LOCAL SEED: The engine path created the local repo dir (0700 root) and wrote the marker (D1)"
      ansible.builtin.assert:
        that:
          - local_seed_engine_dir.stat.exists
          - local_seed_engine_dir.stat.isdir
          - local_seed_engine_dir.stat.mode == '0700'
          - local_seed_engine_dir.stat.pw_name == 'root'
          - local_seed_marker_after_engine.stat.exists
        fail_msg: >-
          The engine path did not create the local second medium directory or the
          seed marker (D1). dir={{ local_seed_engine_dir.stat | default({}) }}
        success_msg: "Engine path created the local repo dir (0700 root) and the seed marker (D1)"

    # The restic stub does not create <local>/config (a real `restic init` does),
    # so simulate it before the idempotence run, mirroring GATE 6.5.
    - name: "LOCAL SEED: Simulate the config written by restic init (stub limitation)"
      ansible.builtin.file:
        path: "/var/backups/restic/{{ inventory_hostname }}/config"
        state: touch
        mode: "0600"

    - name: "LOCAL SEED: Reset the restic stub log for the engine idempotence run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "LOCAL SEED: Re-run the engine-path local seed with the marker present (D1)"
      ansible.builtin.include_role:
        name: L6_runtime/backup
        tasks_from: repo-init-local.yml

    - name: "LOCAL SEED: Read the restic stub log after the idempotence run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: local_seed_engine_second_log
      changed_when: false
      failed_when: false

    - name: "LOCAL SEED: A second engine run performs no init and no copy (D1 idempotence)"
      ansible.builtin.assert:
        that:
          - "'init --repo ' not in local_seed_engine_second_log.stdout"
          - "'copy --repo ' not in local_seed_engine_second_log.stdout"
          - "'cat config --repo ' ~ backup_repo_base_url ~ '/restic/' ~ inventory_hostname in local_seed_engine_second_log.stdout"
        fail_msg: >-
          The engine local seed is not idempotent: a second run re-initialized or
          re-copied. log={{ local_seed_engine_second_log.stdout }}
        success_msg: "Engine local seed is idempotent on the second run (marker honoured, D1)"

    # ---------------------------------------------------------------------------
    # LOCAL SEED: an unavailable source repo (e.g. a host that runs no apps) must
    # SKIP without failing the play and WITHOUT writing the seed marker, so a
    # later deploy retries.
    # ---------------------------------------------------------------------------
    - name: "LOCAL SEED: Simulate an unavailable app-data source repo (D1)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: absent

    - name: "LOCAL SEED: Force a virgin local repo and no seed marker for the skip run (D1)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/backups/restic/{{ inventory_hostname }}/config"
        - /etc/restic/.local-seed-complete

    - name: "LOCAL SEED: Reset the restic stub log for the unavailable-source run"
      ansible.builtin.file:
        path: "{{ shim_dir }}/restic.log"
        state: absent

    - name: "LOCAL SEED: An unavailable source skips without failing the play (D1)"
      block:
        - name: "WHEN: Run the engine-path local seed with the source repo unavailable"
          ansible.builtin.include_role:
            name: L6_runtime/backup
            tasks_from: repo-init-local.yml
      rescue:
        - name: "THEN: An unavailable source MUST NOT fail the local seed (D1)"
          ansible.builtin.fail:
            msg: >-
              The local seed failed when the source repo was unavailable; it must
              skip gracefully (D1). {{ ansible_failed_result.msg | default('') }}

    - name: "LOCAL SEED: Read the restic stub log after the unavailable-source run"
      ansible.builtin.command:
        cmd: "cat {{ shim_dir }}/restic.log"
      register: local_seed_skip_log
      changed_when: false
      failed_when: false

    - name: "LOCAL SEED: Stat the seed marker after the unavailable-source run (D1)"
      ansible.builtin.stat:
        path: /etc/restic/.local-seed-complete
      register: local_seed_marker_after_skip

    - name: "LOCAL SEED: An unavailable source performs no init/copy and writes no marker (D1)"
      ansible.builtin.assert:
        that:
          - "'init --repo ' not in local_seed_skip_log.stdout"
          - "'copy --repo ' not in local_seed_skip_log.stdout"
          - not local_seed_marker_after_skip.stat.exists
        fail_msg: >-
          The local seed mutated state when the source repo was unavailable (D1):
          the marker must stay absent so a later deploy retries.
          log={{ local_seed_skip_log.stdout }}
        success_msg: "Unavailable source -> skip, no init/copy, no seed marker (D1)"

    - name: "LOCAL SEED: Restore the app-data source marker for later gates (D1)"
      ansible.builtin.file:
        path: "{{ shim_dir }}/appdata-repo-exists"
        state: touch
        mode: "0644"

    # ---------------------------------------------------------------------------
    # GATE 6.6 / 6.7: the migration + rollback runbook ships with the change, so
    # an operator has the executable gate steps and the rollback boundary.
    # ---------------------------------------------------------------------------
    - name: "GATE 6.6/6.7: Stat the migration + rollback runbook"
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../../docs/operations/BACKUP_MIGRATION_RUNBOOK.md"
      register: migration_runbook
      delegate_to: localhost
      become: false

    - name: "GATE 6.6/6.7: The migration + rollback runbook ships with the change"
      ansible.builtin.assert:
        that:
          - migration_runbook.stat.exists
        fail_msg: "docs/operations/BACKUP_MIGRATION_RUNBOOK.md is missing (6.6/6.7)"
        success_msg: "Migration + rollback runbook present (6.6/6.7)"
