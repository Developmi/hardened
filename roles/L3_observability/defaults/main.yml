---
# =============================================================================
# L3 OBSERVABILITY - Role Defaults
# =============================================================================
# Override at group_vars/{brain,muscle,local} as needed.
# Layer-gated: only brain/muscle hosts deploy observability components.
# =============================================================================

# ─── Stack images (fallbacks; images.yml is the canonical source) ─────────────
blackbox_exporter_image: "prom/blackbox-exporter:v0.27.0"

# ─── Network & Host (safe defaults; production overrides from SOPS) ───────────
observability_network_name: "observability_net"
observability_stack_host_ip: "127.0.0.1"
observability_exporter_bind_ip: "{{ tailscale_ip | default('127.0.0.1') }}"
observability_cadvisor_port: 18080

# ─── Retention & Intervals ────────────────────────────────────────────────────
observability_retention_period: "14d"      # VictoriaMetrics data retention
observability_scrape_interval: "30s"       # Default scrape interval
observability_scrape_timeout: "10s"        # Default scrape timeout
observability_health_check_interval: "60s" # Blackbox probe interval

# ─── Alert Thresholds ─────────────────────────────────────────────────────────
observability_alert_cpu_threshold: 80       # percent - HighCPU warning
observability_alert_memory_threshold: 85    # percent - HighMemory warning
observability_alert_disk_threshold: 80      # percent - DiskPressure critical
observability_alert_service_down_minutes: 2 # minutes before ServiceDown fires
observability_alert_cert_expiry_days: 14    # days before CertExpiry warning
# Caddy WAF detection alert (M5, contract §7): any Coraza audit event in the
# window fires caddy-audit-detections (works in DetectionOnly and On modes).
observability_alert_caddy_waf_window: "5m"         # LogQL lookback window
observability_alert_caddy_waf_threshold: 0         # events in window to fire

# ─── Health Check Defaults ────────────────────────────────────────────────────
observability_blackbox_port: 9115
observability_blackbox_module: "http_2xx"

# ─── Graceful degradation when L5 has not loaded app_profiles ─────────────────
# default empty list; L5 populates at runtime via group_vars
app_profiles: []
