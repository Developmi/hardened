---
- name: Ensure observability base directory exists
  ansible.builtin.file:
    path: "{{ app_base_dir }}/observability"
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Gather Docker host info for observability stack deployment
  community.docker.docker_host_info:
    networks: true
  register: observability_docker_host_info
  changed_when: false
  failed_when: false
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana

- name: Assert Docker is available for observability deployment
  ansible.builtin.assert:
    that:
      - observability_docker_host_info.can_talk_to_docker | default(false)
    fail_msg: >-
      Docker is not reachable on {{ inventory_hostname }}.
      Observability deployment requires a running Docker daemon and API access.
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Assert observability secrets are configured
  ansible.builtin.assert:
    that:
      - observability_grafana_admin_user is defined
      - observability_grafana_admin_user | length > 0
      - observability_grafana_admin_password is defined
      - observability_grafana_admin_password | length > 0
      - observability_grafana_root_url is defined
      - observability_grafana_root_url | length > 0
    fail_msg: >-
      Define observability_grafana_admin_user, observability_grafana_admin_password,
      and observability_grafana_root_url
      in group_vars/all/secrets.sops.yml before deploying the observability stack.
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


# Output facts: observability_effective_uid, observability_effective_gid, observability_userns_enabled, observability_userns_gid_offset
- name: Detect Docker userns-remap for observability bind-mounts
  ansible.builtin.include_tasks: "{{ role_path }}/../../_shared/userns_detect.yml"
  vars:
    userns_container_uid: 0
    userns_container_gid: 0
    userns_output_prefix: observability
  tags: [l3-observability, observability, monitoring, stack, observability_stack]

- name: Ensure observability stack network exists when managed by this role
  community.docker.docker_network:
    name: "{{ observability_stack_network_name }}"
    driver: bridge
    state: present
  when: not (observability_stack_network_external | bool)
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Preflight | Prompt if external stack network is missing
  ansible.builtin.pause:
    prompt: >-
      You need to run first the l4 stack to create {{ observability_stack_network_name }}
      for this layer. Continue anyway? [y/N]
    timeout: 30
  register: _network_gate_response
  when:
    - observability_stack_network_external | bool
    - (observability_docker_host_info.networks | default([])
       | selectattr('Name', 'equalto', observability_stack_network_name)
       | list | length) == 0
  tags: [l3-observability, observability, monitoring]

- name: Preflight | Stop gracefully when L4 prerequisite is declined
  ansible.builtin.debug:
    msg: >-
      Skipping observability stack: run the L4 stack first
      (make deploy-edge BACKEND=caddy TARGET=<host>) to create
      {{ observability_stack_network_name }} for this layer.
  when:
    - observability_stack_network_external | bool
    - (observability_docker_host_info.networks | default([])
       | selectattr('Name', 'equalto', observability_stack_network_name)
       | list | length) == 0
    - _network_gate_response.user_input | default('') | lower not in ['y', 'yes']
  tags: [l3-observability, observability, monitoring]

- name: Preflight | End play when L4 prerequisite is declined
  ansible.builtin.meta: end_play
  when:
    - observability_stack_network_external | bool
    - (observability_docker_host_info.networks | default([])
       | selectattr('Name', 'equalto', observability_stack_network_name)
       | list | length) == 0
    - _network_gate_response.user_input | default('') | lower not in ['y', 'yes']
  tags: [l3-observability, observability, monitoring]

- name: Assert external observability stack network exists
  ansible.builtin.assert:
    that:
      - >-
        (observability_docker_host_info.networks | default([])
        | selectattr('Name', 'equalto', observability_stack_network_name)
        | list | length) > 0
    fail_msg: >-
      External Docker network {{ observability_stack_network_name }} does not exist on {{ inventory_hostname }}.
      Create it before deploying the observability stack or set observability_stack_network_external: false.
  when: observability_stack_network_external | bool
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Ensure VictoriaMetrics data directory exists (mapped root)
  ansible.builtin.file:
    path: "{{ app_base_dir }}/observability/victoria-data"
    state: directory
    mode: "0755"
    owner: "{{ (observability_effective_uid | int) + 0 }}"
    group: "{{ (observability_effective_gid | int) + 0 }}"
    recurse: true
  tags: [l3-observability, observability, monitoring, stack, observability_stack, victoriametrics]

- name: Ensure Grafana data directory exists (UID 472)
  ansible.builtin.file:
    path: "{{ app_base_dir }}/observability/grafana-data"
    state: directory
    mode: "0775"
    owner: "{{ (observability_effective_uid | int) + 472 }}"
    group: "{{ (observability_effective_gid | int) + 472 }}"
    recurse: true
  tags: [l3-observability, observability, monitoring, stack, observability_stack, grafana]

- name: Ensure Loki data directory exists (UID 10001)
  ansible.builtin.file:
    path: "{{ app_base_dir }}/observability/loki-data"
    state: directory
    mode: "0775"
    owner: "{{ (observability_effective_uid | int) + 10001 }}"
    group: "{{ (observability_effective_gid | int) + 10001 }}"
    recurse: true
  tags: [l3-observability, observability, monitoring, stack, observability_stack, loki]

- name: Create VictoriaMetrics scrape config (Dynamic Inventory)
  ansible.builtin.template:
    src: general/templates/victoriametrics-scrape.yml.j2
    dest: "{{ app_base_dir }}/observability/victoriametrics-scrape.yml"
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - grafana


- name: Create Loki config
  ansible.builtin.copy:
    dest: "{{ app_base_dir }}/observability/loki-config.yml"
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        ring:
          instance_addr: 127.0.0.1
          kvstore:
            store: inmemory
        replication_factor: 1
        path_prefix: /loki
      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage_config:
        filesystem:
          directory: /loki/chunks
      # PCI DSS 10.5: retain >= 12 months; >= 3 months immediately available.
      # The filesystem store requires the compactor for retention to apply.
      limits_config:
        retention_period: 8760h
      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem
    mode: "0644"

  tags: [l3-observability, observability, monitoring, stack, observability_stack, loki]

- name: Create Alloy config (River — Caddy log shipping, D6)
  ansible.builtin.copy:
    dest: "{{ app_base_dir }}/observability/alloy-config.alloy"
    content: |
      // Caddy log shipping to Loki (contract §7, D6).
      // Alloy replaces promtail (EOL 2026-03-02). Push API is stable
      // against Loki 3.6.x. Non-__path__ target keys become stream labels.
      loki.source.file "caddy_access" {
        targets = [{__path__ = "/var/log/caddy/access.log", job = "caddy-access", instance = "${ALLOY_INSTANCE}"}]
        forward_to = [loki.write.caddy.receiver]
        tail_from_end = true
      }

      loki.source.file "caddy_runtime" {
        targets = [{__path__ = "/var/log/caddy/caddy.log", job = "caddy-runtime", instance = "${ALLOY_INSTANCE}"}]
        forward_to = [loki.write.caddy.receiver]
        tail_from_end = true
      }

      loki.source.file "caddy_audit" {
        targets = [{__path__ = "/var/log/caddy/coraza-audit.log", job = "caddy-audit", instance = "${ALLOY_INSTANCE}"}]
        forward_to = [loki.write.caddy.receiver]
        tail_from_end = true
      }

      loki.write "caddy" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
    mode: "0644"
  tags: [l3-observability, observability, monitoring, stack, observability_stack, alloy, loki]

- name: Ensure Alloy data directory exists (UID 1337 — Caddy UID)
  ansible.builtin.file:
    path: "{{ app_base_dir }}/observability/alloy-data"
    state: directory
    mode: "0775"
    owner: "{{ (observability_effective_uid | int) + 1337 }}"
    group: "{{ (observability_effective_gid | int) + 1337 }}"
    recurse: true
  tags: [l3-observability, observability, monitoring, stack, observability_stack, alloy]

- name: Create Grafana datasource config
  ansible.builtin.copy:
    dest: "{{ app_base_dir }}/observability/grafana-datasource.yml"
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          uid: victoriametrics
          type: prometheus
          url: http://victoria-metrics:8428
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
    mode: "0644"
  tags: [l3-observability, observability, monitoring, stack, observability_stack, grafana]

- name: Render observability stack compose from template
  ansible.builtin.template:
    src: general/templates/observability-stack-docker-compose.yml.j2
    dest: "{{ app_base_dir }}/observability/docker-compose.yml"
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Render observability live env file
  ansible.builtin.template:
    src: general/templates/observability-stack.env.j2
    dest: "{{ app_base_dir }}/observability/.env"
    mode: "0600"
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Render observability .env example
  ansible.builtin.template:
    src: general/templates/observability-stack.env.example.j2
    dest: "{{ app_base_dir }}/observability/.env.example"
    mode: "0644"
  tags:
    - l3-observability
    - observability
    - monitoring
    - stack
    - observability_stack
    - victoriametrics
    - loki
    - grafana


- name: Remove containers with stale directory mounts (Docker bind-mount precondition)
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}/observability"
    files:
      - docker-compose.yml
    services:
      - grafana
      - blackbox-exporter
    state: absent
  register: _cleanup_broken_containers
  failed_when: false
  changed_when: false
  tags: [l3-observability, observability, monitoring, stack, observability_stack]

- name: Deploy observability stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}/observability"
    files:
      - docker-compose.yml
    env_files:
      - .env
    state: present
    pull: "{{ observability_compose_pull_policy }}"
    recreate: "{{ observability_compose_recreate_policy }}"
    remove_orphans: true
    wait: true
    wait_timeout: "{{ observability_compose_wait_timeout }}"
  register: observability_stack_compose_result
  when: >-
    'all' in ansible_run_tags or
    'observability' in ansible_run_tags or
    'monitoring' in ansible_run_tags or
    'stack' in ansible_run_tags or
    'observability_stack' in ansible_run_tags
  tags: [l3-observability, observability, monitoring, stack, observability_stack]

- name: Deploy VictoriaMetrics service only
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}/observability"
    files:
      - docker-compose.yml
    env_files:
      - .env
    services:
      - victoria-metrics
    state: present
    pull: "{{ observability_compose_pull_policy }}"
    recreate: "{{ observability_compose_recreate_policy }}"
    wait: true
    wait_timeout: "{{ observability_compose_wait_timeout }}"
  register: observability_victoriametrics_compose_result
  when: >-
    'victoriametrics' in ansible_run_tags and
    'all' not in ansible_run_tags and
    'observability' not in ansible_run_tags and
    'monitoring' not in ansible_run_tags and
    'stack' not in ansible_run_tags and
    'observability_stack' not in ansible_run_tags
  tags: [l3-observability, victoriametrics]

- name: Deploy Loki service only
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}/observability"
    files:
      - docker-compose.yml
    env_files:
      - .env
    services:
      - loki
    state: present
    pull: "{{ observability_compose_pull_policy }}"
    recreate: "{{ observability_compose_recreate_policy }}"
    wait: true
    wait_timeout: "{{ observability_compose_wait_timeout }}"
  register: observability_loki_compose_result
  when: >-
    'loki' in ansible_run_tags and
    'all' not in ansible_run_tags and
    'observability' not in ansible_run_tags and
    'monitoring' not in ansible_run_tags and
    'stack' not in ansible_run_tags and
    'observability_stack' not in ansible_run_tags
  tags: [l3-observability, loki]

- name: Deploy Grafana service only
  community.docker.docker_compose_v2:
    project_src: "{{ app_base_dir }}/observability"
    files:
      - docker-compose.yml
    env_files:
      - .env
    services:
      - grafana
    state: present
    pull: "{{ observability_compose_pull_policy }}"
    recreate: "{{ observability_compose_recreate_policy }}"
    wait: true
    wait_timeout: "{{ observability_compose_wait_timeout }}"
  register: observability_grafana_compose_result
  when: >-
    'grafana' in ansible_run_tags and
    'all' not in ansible_run_tags and
    'observability' not in ansible_run_tags and
    'monitoring' not in ansible_run_tags and
    'stack' not in ansible_run_tags and
    'observability_stack' not in ansible_run_tags
  tags: [l3-observability, grafana]

- name: Display observability stack preparation summary
  ansible.builtin.debug:
    msg:
      - "Observability stack deployed on {{ inventory_hostname }}"
      - "Compose: {{ app_base_dir }}/observability/docker-compose.yml"
      - "Env file: {{ app_base_dir }}/observability/.env"
      - "Env example: {{ app_base_dir }}/observability/.env.example"
      - "Changed: {{ observability_stack_compose_result.changed }}"
  when: observability_stack_compose_result is defined
  tags: [l3-observability, observability, monitoring, stack, observability_stack]

- name: Display VictoriaMetrics deployment summary
  ansible.builtin.debug:
    msg:
      - "VictoriaMetrics deployed on {{ inventory_hostname }}"
      - "Compose: {{ app_base_dir }}/observability/docker-compose.yml"
      - "Changed: {{ observability_victoriametrics_compose_result.changed }}"
  when: observability_victoriametrics_compose_result is defined
  tags: [l3-observability, victoriametrics]

- name: Display Loki deployment summary
  ansible.builtin.debug:
    msg:
      - "Loki deployed on {{ inventory_hostname }}"
      - "Compose: {{ app_base_dir }}/observability/docker-compose.yml"
      - "Changed: {{ observability_loki_compose_result.changed }}"
  when: observability_loki_compose_result is defined
  tags: [l3-observability, loki]

- name: Display Grafana deployment summary
  ansible.builtin.debug:
    msg:
      - "Grafana deployed on {{ inventory_hostname }}"
      - "Compose: {{ app_base_dir }}/observability/docker-compose.yml"
      - "Changed: {{ observability_grafana_compose_result.changed }}"
  when: observability_grafana_compose_result is defined
  tags: [l3-observability, grafana]
