---
# -----------------------------------------------------------------
# NIST Evidence Collection - opt-in via l2_compliance_enabled: true
# Set in inventory/group_vars/ or pass -e l2_compliance_enabled=true
# Evidence output: /srv/evidence/nist/<control-id>/
# -----------------------------------------------------------------
# ==============================================================================
# COMPLIANCE - Evidence Collection: SC-7 (Boundary Protection)
# ==============================================================================
# Collects: firewall status (ufw or nftables), fail2ban jail status.
# Output: /srv/evidence/nist/sc-7/
# Read-only - no services restarted, no configs modified.
# ==============================================================================

- name: "SC-7 | Ensure evidence directory exists"
  ansible.builtin.file:
    path: /srv/evidence/nist/sc-7
    state: directory
    mode: "0755"
  tags: [compliance, l2-compliance, nist, sc-7]

- name: "SC-7 | Collect firewall status (nftables)"
  ansible.builtin.command: nft list ruleset
  register: _sc7_nft
  changed_when: false
  failed_when: false
  tags: [compliance, l2-compliance, nist, sc-7]

- name: "SC-7 | Write firewall status evidence"
  ansible.builtin.copy:
    dest: /srv/evidence/nist/sc-7/firewall_status
    content: "{{ _sc7_nft.stdout | default('nftables ruleset empty or unavailable') }}"
    mode: "0640"
  tags: [compliance, l2-compliance, nist, sc-7]

- name: "SC-7 | Collect fail2ban jail status"
  ansible.builtin.command: fail2ban-client status sshd
  register: _sc7_f2b
  changed_when: false
  failed_when: false
  tags: [compliance, l2-compliance, nist, sc-7]

- name: "SC-7 | Write fail2ban status evidence"
  ansible.builtin.copy:
    dest: /srv/evidence/nist/sc-7/fail2ban_status
    content: "{{ _sc7_f2b.stdout | default('fail2ban not running or sshd jail not configured') }}"
    mode: "0640"
  tags: [compliance, l2-compliance, nist, sc-7]
