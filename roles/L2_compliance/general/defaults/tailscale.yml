---
# ==============================================================================
# Tailscale Client Role - Default Safe Fallbacks
# ==============================================================================
# Invariant role defaults. Topology, ports, nodeAttrs, and global tailnet policies
# are configured in inventory/group_vars/all/tailscale.yml. Sensitive identities
# and credentials reside in inventory/group_vars/all/secrets.sops.yml.

# Manual authentication bypass (false by default; nodes require tailscale_auth_key)
tailscale_manual_auth: false

# Fallback node attributes (empty by default)
tailscale_node_attrs: []

# Fallback serve flags (disabled by default)
tailscale_acl_serve_enabled: false
tailscale_serve_enabled: false
tailscale_serve_target: "8080"
tailscale_serve_port: "8443"
