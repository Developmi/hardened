---
# ==============================================================================
# USER HARDENING ROLE - L2 Compliance Dispatcher (NIST AC-2, AC-6)
# ==============================================================================
# Pre-flight: assert ansible_user is root/ubuntu (not yet transitioned).
# Then: create users → deploy SSH keys → configure sudoers.
# Tags: functional + l2-compliance + NIST control tags.
# ==============================================================================

- name: "Include user hardening defaults (user_hardening_users)"
  ansible.builtin.include_vars:
    file: "{{ role_path }}/general/defaults/user_hardening.yml"
  tags: [always]

- name: "AC-2 | Pre-flight: Verify connection user is root, ubuntu, or automation"
  ansible.builtin.assert:
    that:
      - (ansible_user | default(ansible_env.USER | default('unknown'))) in ['root', 'ubuntu', 'automation']
    fail_msg: "Connection user {{ ansible_user | default(ansible_env.USER) }} is not root, ubuntu, or automation. This role must run with administrative privileges."
    success_msg: "Connection user authorized for user management"
  tags: [users, l2-compliance, nist, ac-2]

- name: "AC-2 | Create system users (dev_admin, automation, breakglass)"
  ansible.builtin.include_tasks: "{{ role_path }}/general/tasks/user_hardening/create_users.yml"
  tags: [users, l2-compliance, nist, ac-2]

- name: "AC-2 | Deploy SSH public keys from SOPS"
  ansible.builtin.include_tasks: "{{ role_path }}/general/tasks/user_hardening/deploy_keys.yml"
  tags: [users, l2-compliance, nist, ac-2]

- name: "AC-6 | Configure sudoers fragments"
  ansible.builtin.include_tasks: "{{ role_path }}/general/tasks/user_hardening/configure_sudoers.yml"
  tags: [users, l2-compliance, nist, ac-6]
