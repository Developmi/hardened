---
# ==============================================================================
# SECURITY - SSH Hardening (NIST AC-2)
# ==============================================================================
# Disables password auth, root login, challenge-response, empty passwords.
# Enforces key-only auth from admin_cidr. Heartbeat prevents idle disconnect.
# ==============================================================================

- name: "AC-2 | Configure SSH ClientAliveInterval (heartbeat 60s)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ClientAliveInterval"
    line: "ClientAliveInterval 60"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Configure SSH ClientAliveCountMax"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ClientAliveCountMax"
    line: "ClientAliveCountMax 3"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable password authentication"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Restrict root login"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin {{ 'prohibit-password' if (bootstrap_mode | default(false)) else 'no' }}"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable challenge-response authentication"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?ChallengeResponseAuthentication"
    line: "ChallengeResponseAuthentication no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable empty passwords"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitEmptyPasswords"
    line: "PermitEmptyPasswords no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Remove obsolete SSH Protocol directive"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Protocol"
    state: absent
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable X11Forwarding"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?X11Forwarding"
    line: "X11Forwarding no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

# ─── SSH Crypto Hardening (CIS 5.2.14-5.2.16) ──────────────────────────

- name: "AC-2 | Configure SSH Ciphers (CIS 5.2.14)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?Ciphers"
    line: "Ciphers {{ ssh_ciphers }}"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Configure SSH MACs (CIS 5.2.15)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?MACs"
    line: "MACs {{ ssh_macs }}"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Configure SSH KexAlgorithms (CIS 5.2.16)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?KexAlgorithms"
    line: "KexAlgorithms {{ ssh_kex_algorithms }}"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

# ─── SSH Security Options (CIS 5.2.x) ────────────────────────────────────

- name: "AC-2 | Set SSH LogLevel VERBOSE (CIS 5.2.2)"
  ansible.builtin.lineinfile:
