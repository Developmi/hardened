  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Set SSH LoginGraceTime 60 (CIS 5.2.17)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?LoginGraceTime"
