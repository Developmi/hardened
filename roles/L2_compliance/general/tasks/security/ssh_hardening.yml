    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH PermitUserEnvironment (CIS 5.2.10)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitUserEnvironment"
    line: "PermitUserEnvironment no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH AllowAgentForwarding"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?AllowAgentForwarding"
    line: "AllowAgentForwarding no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH AllowTcpForwarding"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?AllowTcpForwarding"
    line: "AllowTcpForwarding no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH TCPKeepAlive"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?TCPKeepAlive"
    line: "TCPKeepAlive no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH HostbasedAuthentication (CIS 5.2.13)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?HostbasedAuthentication"
    line: "HostbasedAuthentication no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Disable SSH GSSAPIAuthentication (CIS 5.1.9)"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?GSSAPIAuthentication"
    line: "GSSAPIAuthentication no"
    state: present
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

# ─── SSH Boot Race Fix (sshd waits for tailscaled) ─────────────────────

- name: "AC-2 | Ensure sshd waits for Tailscale before starting"
  ansible.builtin.blockinfile:
    path: /etc/systemd/system/ssh.service.d/override.conf
    marker: "# {mark} ANSIBLE MANAGED - sshd tailscale dependency"
    block: |
      [Unit]
      After=network-online.target tailscaled.service
      Wants=network-online.target
    create: true
    mode: "0644"
  when: l2_tailscale_enabled | default(true)
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Restrict SSH access by source IP (bootstrap-aware)"
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED - AllowUsers bootstrap-aware"
    block: |
      AllowUsers automation@100.64.0.0/10 dev_admin@100.64.0.0/10 breakglass@100.64.0.0/10
      {% if bootstrap_mode | default(false) %}
      AllowUsers automation@{{ controller_ip }} dev_admin@{{ controller_ip }} breakglass@{{ controller_ip }}
      {% endif %}
    state: present
    create: true
    insertbefore: BOF
    validate: "sshd -t -f %s"
  notify: Restart SSH
  tags: [ssh, l2-compliance, nist, ac-2]

- name: "AC-2 | Cleanup orphaned AllowUsers marker (pre-v2)"
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} ANSIBLE MANAGED BLOCK - security-hardening-fix"
    block: ""
    state: absent
  tags: [ssh, l2-compliance, nist, ac-2]
