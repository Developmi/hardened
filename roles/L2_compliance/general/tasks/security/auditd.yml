---
# ==============================================================================
# SECURITY - Auditd System Monitoring (NIST SI-4, AU-12)
# ==============================================================================
# Installs and configures auditd for privileged command logging and file
# integrity monitoring. Rules cover passwd, sudoers, ssh, and firewall configs.
# ==============================================================================

- name: "SI-4/AU-12 | Install auditd and audispd-plugins"
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    lock_timeout: 600
  tags: [audit, l2-compliance, nist, si-4, au-12]

- name: "SI-4/AU-12 | Configure auditd rules for privileged commands"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/nist-hardening.rules
    content: |
      ## NIST 800-53 SI-4 / AU-12 Compliance Rules
      -a always,exit -F arch=b64 -S execve -k privileged_commands
      -a always,exit -F arch=b32 -S execve -k privileged_commands
      -w /etc/passwd -p wa -k identity_management
      -w /etc/group -p wa -k identity_management
      -w /etc/shadow -p wa -k identity_management
      -w /etc/sudoers -p wa -k sudoers_change
      -w /var/log/auth.log -p wa -k auth_log_tampering
      -w /etc/ssh/sshd_config -p wa -k ssh_config_change
      -w /etc/ufw -p wa -k firewall_config
      -w /etc/nftables.conf -p wa -k firewall_config
      -w /etc/docker -p wa -k docker_config
    mode: "{{ auditd_rules_file_mode }}"
  notify: Restart auditd
  tags: [audit, l2-compliance, nist, si-4, au-12]

- name: "SI-4/AU-12 | Ensure auditd is enabled and running"
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true
  # Known limitation: auditd cannot start inside containers/LXC (kernel audit
  # subsystem is not namespaced). Config files are written correctly regardless.
  ignore_errors: yes
  tags: [audit, l2-compliance, nist, si-4, au-12]

- name: "SI-4/AU-12 | Verify auditd is collecting logs"
  ansible.builtin.command: auditctl -l
  register: audit_rules
  changed_when: false
  failed_when: audit_rules.rc != 0
  ignore_errors: yes
  tags: [audit, l2-compliance, nist, si-4, au-12]

# ==============================================================================
# Caddy-specific auditd rules (NIST AU-12) - dedicated drop-in ruleset
# ==============================================================================

- name: "AU-12 | Check Caddy installation"
  ansible.builtin.stat:
    path: "{{ app_base_dir }}/ingress/Caddyfile"
  register: _caddy_installed
  tags: [audit, l2-compliance, nist, au-12]

- name: "AU-12 | Configure auditd rules for Caddy and Coraza"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/caddy.rules
    content: |
      ## NIST 800-53 AU-12 Caddy & Coraza Audit Rules
      -w {{ app_base_dir }}/ingress/Caddyfile -p wa -k caddy_config_change
      -w {{ app_base_dir }}/ingress -p wa -k caddy_stack_change
      -w {{ app_base_dir }}/ingress/caddy-data/logs -p wa -k caddy_log_tampering
      -w {{ app_base_dir }}/ingress/caddy-data/logs/access.log -p wa -k caddy_access_log_change
      -w {{ app_base_dir }}/ingress/caddy-data/logs/caddy.log -p wa -k caddy_runtime_log_change
      -w {{ app_base_dir }}/ingress/caddy-data/logs/coraza-audit.log -p wa -k caddy_audit_log_change
    mode: "{{ auditd_rules_file_mode }}"
  notify: Restart auditd
  when: _caddy_installed.stat.exists
  tags: [audit, l2-compliance, nist, au-12]

- name: "AU-12 | Remove Caddy auditd rules when Caddy is absent"
  ansible.builtin.file:
    path: /etc/audit/rules.d/caddy.rules
    state: absent
  notify: Restart auditd
  when: not _caddy_installed.stat.exists
  tags: [audit, l2-compliance, nist, au-12]
