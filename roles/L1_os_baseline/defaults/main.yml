---
# ==============================================================================
# L1 OS Baseline - Role Defaults
# ==============================================================================
# Safe fallback defaults for all L1 tasks.
# Override via group_vars per target.
# ==============================================================================

l1_apt_cache_valid_time: 3600
l1_apt_lock_timeout: 600
l1_file_mode: "0644"

platform_name: "Developmi Hardened"
platform_version: "v7.0.0-dev"
motd_clean_ads: true

systemd_nofile_soft: 1024
systemd_nofile_hard: 524288
systemd_nproc_soft: 1024
systemd_nproc_hard: 524288

# ── Legacy alias (used by existing tasks) ────────────────────────────────────
file_mode_default: "{{ l1_file_mode }}"

# ── apt-mark hold (package pinning) ──────────────────────────────────────────
# Override in group_vars per target. Empty list = no packages held.
pinned_packages: []

# ── Universe repository ──────────────────────────────────────────────────────
# Mirror URI derived from the host architecture: ports.ubuntu.com serves the
# ARM architectures (aarch64/armhf), archive.ubuntu.com serves amd64. This is
# only a default and can be overridden per host/group (e.g. a regional mirror)
# via host_vars/group_vars. Role-level defaults are loaded for the whole role,
# so both general/ and ubuntu_22.04/ see it.
l1_universe_uris: "{{ 'http://ports.ubuntu.com/ubuntu-ports' if ansible_facts['architecture'] in ['aarch64', 'arm64', 'armhf', 'armv7l'] else 'http://archive.ubuntu.com/ubuntu' }}"
