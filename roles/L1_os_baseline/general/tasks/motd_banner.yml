---
# ==============================================================================
# L1 OS Baseline - Hardened MOTD & Legal Notice Banner (NIST AC-8, CIS 1.7)
# ==============================================================================
# Strips commercial ad telemetry (Canonical ESM, motd-news) and deploys
# a clean platform identification banner and authorized usage warning.
# ==============================================================================

- name: "AC-8 | Disable Ubuntu motd-news ad service"
  ansible.builtin.lineinfile:
    path: /etc/default/motd-news
    regexp: "^#?ENABLED="
    line: "ENABLED=0"
    state: present
    create: true
    mode: "0644"
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - motd_clean_ads | default(true)
  tags: [l1-os-baseline, motd, banner, nist, ac-8]

- name: "AC-8 | Silence Ubuntu dynamic ad and promotional motd scripts"
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 10-help-text
    - 50-motd-news
    - 88-esm-announce
    - 91-contract-ua-esm-status
    - 95-hwe-eol
  failed_when: false
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - motd_clean_ads | default(true)
  tags: [l1-os-baseline, motd, banner, nist, ac-8]

- name: "AC-8 | Deploy clean platform login banner (/etc/motd)"
  ansible.builtin.copy:
    dest: /etc/motd
    content: |
      ==============================================================================
      Stack Developmi
      {{ platform_version | default('v7.0.0-dev') }}
      ==============================================================================
      Authorized access only. All activities are monitored and logged.
    mode: "0644"
    owner: root
    group: root
  tags: [l1-os-baseline, motd, banner, nist, ac-8]

- name: "AC-8 | Deploy authorized access banner for SSH pre-login (/etc/issue.net)"
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: |
      ******************************************************************************
      *                          DEVELOPMI PLATFORM HARDENED                       *
      *                               {{ platform_version | default('v7.0.0-dev') }}                                *
      *                                                                            *
      *  UNAUTHORIZED ACCESS TO THIS SYSTEM IS STRICTLY PROHIBITED BY LAW.         *
      *  ALL CONNECTIONS AND ACTIVITIES ARE LOGGED AND MONITORED.                  *
      ******************************************************************************
    mode: "0644"
    owner: root
    group: root
  tags: [l1-os-baseline, motd, banner, nist, ac-8]
