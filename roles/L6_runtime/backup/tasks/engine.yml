---
# =============================================================================
# Unified backup engine - dispatch (D11/ENGINE-001)
# =============================================================================
# Source of truth: apps/*/profile.yml on the controller (ADR-03). The engine
# scans profiles, deploys the shared quiesce library, and renders one
# self-skipping systemd unit pair per dump-able app. It replaces the retired
# `backup-db` role and the per-path backup playbooks (backup-appdata,
# backup-timers, backup-databases).
#
# NOTE: with_fileglob cannot express `apps/*/profile.yml` under ansible-core
# 2.21.1 (the dir segment is resolved via the search path). The controller-side
# `find` via the pipe lookup is used instead - profiles live on the controller,
# not on managed hosts.
# =============================================================================

- name: "Engine | Ensure the engine script directory exists"
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"
    owner: root
    group: root
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Deploy the ordered quiesce library (D12/TIER-003)"
  ansible.builtin.include_tasks: quiesce.yml
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Optionally install the pinned restic binary (D3)"
  ansible.builtin.include_tasks: install.yml
  when: backup_engine_install_restic | default(false) | bool
  tags: [l6-runtime, backup, backup_engine, restic_install]

# Fix 4 (virgin-host gap): every engine runner targets the app-data repository
# restic/<inventory_hostname>, which no code path ever initialized. Probe then
# init it once here; a live repository is never re-initialized (D4).
- name: "Engine | Initialize the app-data repository on a virgin host (Fix 4)"
  ansible.builtin.include_tasks: repo-init-appdata.yml
  tags: [l6-runtime, backup, backup_engine, restic_init]

# D1 second medium: create and seed the local FS repository
# /var/backups/restic/<inventory_hostname> from the app-data repo. This must run
# AFTER repo-init-appdata.yml so the source repository exists before the seed.
# It probes the source read-only and skips without failing when the source is
# absent (e.g. a host that does not run apps).
- name: "Engine | Create and seed the local second medium (D1)"
  ansible.builtin.include_tasks: repo-init-local.yml
  tags: [l6-runtime, backup, backup_engine, restic_local]

# ---------------------------------------------------------------------------
# Tier1 guaranteed databases (TIER-001/D14): postgres / clickhouse / redis-valkey
# are protected with NO app declaration. Discovery happens at backup time in
# the host-level runner; this deploy-time probe records what is currently
# running so an operator can see the protected set without a declaration.
# ---------------------------------------------------------------------------
- name: "Engine | Discover the docker CLI for Tier1 (D14)"
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _engine_tier1_docker
  changed_when: false
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Probe Tier1 database containers by image (TIER-001/D14)"
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - ps
      - --format
      - "{% raw %}{{.Names}} {{.Image}}{% endraw %}"
  register: _engine_tier1_probe
  changed_when: false
  failed_when: false
  when: _engine_tier1_docker.stat.exists | default(false)
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Report the deploy-time Tier1 discovery set (TIER-001)"
  ansible.builtin.debug:
    msg: >-
      engine[tier1]: {{ inventory_hostname }} runs
      {{ _engine_tier1_probe.stdout_lines | default([]) | length }} container(s);
      the Tier1 runner re-discovers postgres/clickhouse/redis-valkey by image at
      backup time.
  when: _engine_tier1_docker.stat.exists | default(false)
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Deploy the Tier1 discovery runner (TIER-001/D14)"
  ansible.builtin.template:
    src: backup-tier1.sh.j2
    dest: /usr/local/bin/backup-tier1.sh
    mode: "0755"
    owner: root
    group: root
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Deploy the Tier1 service unit (TIER-001)"
  ansible.builtin.template:
    src: backup-tier1.service.j2
    dest: /etc/systemd/system/backup-tier1.service
    mode: "0644"
  notify: reload systemd
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Deploy the Tier1 timer unit (TIER-001)"
  ansible.builtin.template:
    src: backup-tier1.timer.j2
    dest: /etc/systemd/system/backup-tier1.timer
    mode: "0644"
  notify: reload systemd
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Enable and start the Tier1 timer (TIER-001)"
  ansible.builtin.systemd:
    name: backup-tier1.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [l6-runtime, backup, backup_engine, backup_tier1]

- name: "Engine | Normalize deployed apps list"
  ansible.builtin.set_fact:
    _deployed_apps_normalized: >-
      {{ (deployed_apps.split(',') if deployed_apps is string else (deployed_apps | default([])))
         | map('trim') | reject('equalto', '') | list }}
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Clean up orphaned backup timers and units"
  ansible.builtin.include_tasks: cleanup_orphans.yml
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Collect app profile files for deployed apps (controller side)"
  ansible.builtin.set_fact:
    _app_profile_paths: >-
      {{ lookup('ansible.builtin.pipe',
           'for app in ' ~ (_deployed_apps_normalized | join(' ')) ~ '; do ' ~
           'p=' ~ (inventory_dir + '/../apps') | quote ~ '/"$app"/profile.yml; ' ~
           '[ -f "$p" ] && echo "$p"; done')
         .splitlines() | reject('equalto', '') | list | sort if (_deployed_apps_normalized | length > 0) else [] }}
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Render the unit pair for each app profile"
  ansible.builtin.include_tasks: deploy_from_profile.yml
  loop: "{{ _app_profile_paths }}"
  tags: [l6-runtime, backup, backup_engine]

- name: "Engine | Flush handlers (systemd daemon-reload)"
  ansible.builtin.meta: flush_handlers
  tags: [l6-runtime, backup, backup_engine]
