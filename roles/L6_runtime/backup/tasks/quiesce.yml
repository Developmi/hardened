---
# =============================================================================
# Unified backup engine - ordered quiesce helper (D12/TIER-003)
# =============================================================================
# The engine MUST dump the logical database first, then quiesce the container,
# then tar the volume, then unpause. This helper is sourced by every rendered
# per-app runner and guarantees the unpause with an EXIT trap, so an aborted
# tar never leaves the container paused (TIER-003 "Unpause guaranteed").
# Live tarballs (consistency != quiesce) are crash-consistent only and MUST NOT
# be described as application-consistent.
# =============================================================================

- name: "Engine | Deploy quiesce library (D12/TIER-003)"
  ansible.builtin.copy:
    dest: "{{ backup_engine_quiesce_lib }}"
    mode: "0755"
    owner: root
    group: root
    content: |
      #!/usr/bin/env bash
      # backup-engine-quiesce.sh - ordered quiesce for Tier2 volume backups.
      # Managed by Ansible: roles/L6_runtime/backup/tasks/quiesce.yml
      # Order (TIER-003): dump (caller) -> pause -> tar -> unpause.
      # The unpause is guaranteed by an EXIT trap.
      #
      # IMPORTANT: the EXIT trap runs AFTER the function frame unwinds, so it
      # MUST read GLOBALS only. Function-locals are invisible to the trap and,
      # under `set -u`, referencing them aborts the trap and leaves the
      # container PAUSED (TIER-003 "Unpause guaranteed" regression guard).

      _backup_quiesce_container=""
      _backup_quiesce_paused=0

      _backup_quiesce_cleanup() {
        if [ "${_backup_quiesce_paused:-0}" -eq 1 ] \
          && [ -n "${_backup_quiesce_container:-}" ]; then
          docker unpause "$_backup_quiesce_container" >/dev/null 2>&1 || true
        fi
      }

      backup_volume_quiesced() {
        local container="$1" volume="$2" app="$3" timestamp="$4"
        _backup_quiesce_container="$container"
        _backup_quiesce_paused=0
        trap _backup_quiesce_cleanup EXIT
        docker pause "$container"
        _backup_quiesce_paused=1
        docker run --rm --security-opt no-new-privileges:true --cap-drop ALL \
          -v "${volume}:/data:ro" "{{ backup_tar_image }}" tar czf - -C /data . \
          | restic backup --stdin \
              --stdin-filename "${app}_${volume}_${timestamp}.tar.gz" \
              --tag "volume,${app}" --host "$(hostname -s)"
        docker unpause "$container"
        _backup_quiesce_paused=0
        trap - EXIT
      }
  tags: [l6-runtime, backup, backup_engine]
