---
# L6 Runtime Backup - Consolidated defaults
# Merged from: roles/stack_backup/, roles/backup/, roles/backup-timers/
# All secrets are in group_vars/all/secrets.sops.yml (SOPS-encrypted).

# ── stack_backup defaults ──
# Single restic pin (D3/STORAGE-001): one version, one binary path, one image
# tag. Do NOT declare a second pin in any other role - the retired `backup-db`
# role no longer exists; the unified engine consumes this same pin.
restic_version: "0.19.1"
restic_install_path: "/usr/local/bin/restic"
restic_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
# SHA256 values verified against the upstream release checksum manifest for
# v0.19.1 (https://github.com/restic/restic/releases/download/v0.19.1/SHA256SUMS).
# Refresh both values from that manifest whenever restic_version is bumped.
restic_sha256: "{{ 'a5f64aaab53d51e311fa3829124c5b703f2d14cf187d8640b6be3b2b49376465' if ansible_facts['architecture'] == 'aarch64' else 'f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c' }}"
restic_download_url: "https://github.com/restic/restic/releases/download/v{{ restic_version }}/restic_{{ restic_version }}_linux_{{ restic_arch }}.bz2"

# Timer staggering per inventory group (stack_backup)
restic_backup_time_by_group:
  brain: "02:00"
  muscle: "03:00"
  local: "04:00"

restic_check_time_by_group:
  brain: "Sun 02:00"
  muscle: "Sun 03:00"
  local: "Sun 04:00"

restic_prune_time_by_group:
  brain: "Sat 02:00"
  muscle: "Sat 03:00"
  local: "Sat 04:00"

# ── Common (deduplicated) ──
# Storage coordinates (endpoint/region/bucket) and the provider switch live in
# inventory/group_vars/all/main.yml (STORAGE-004/005, design D10). The role
# builds one repo base URL from them and appends its retention-owner prefix.

# ── Retention owners (D9/STORAGE-002) ──
# Each repository prefix has exactly ONE owner so retention on one repository
# can never prune the other:
#   app-data     -> restic/<host>        (owner: app-data backup path)
#   stack-config -> stack-restic/<host>  (owner: stack backup path)
restic_appdata_repo_url: "{{ backup_repo_base_url }}/restic/{{ inventory_hostname }}"
# The stack-config repo deliberately keeps the HISTORICAL ansible_hostname key
# (design D4 / open Q1). It is the pre-migration URL and the `restic copy`
# fallback source when ansible_hostname != inventory_hostname. Do NOT rewrite it
# to inventory_hostname: that would point at a different repository and orphan
# the existing stack snapshots. The engine's own repo is restic_appdata_repo_url,
# which is keyed by inventory_hostname.
restic_repo_url: "{{ backup_repo_base_url }}/stack-restic/{{ ansible_hostname }}"

# ── Second medium (D1/3-2-1-1-0) ──
# Local filesystem restic repository, seeded from R2 by `restic copy` so the
# platform keeps a second, distinct-medium copy of every snapshot.
restic_local_repo_path: "/var/backups/restic/{{ inventory_hostname }}"

# ── backup/ (app-data backup) defaults ──
restic_image: "restic/restic:0.19.1"
backup_tar_image: "alpine:3.21.3"

# ── Unified engine (D11/ENGINE-001) ──
# Shared ordered-quiesce helper sourced by every rendered per-app runner
# (D12/TIER-003: dump -> docker pause -> tar -> docker unpause, EXIT trap).
backup_engine_quiesce_lib: "/usr/local/bin/backup-engine-quiesce.sh"
# The restic binary is installed by the stack path (backup-stack.yml). The
# engine playbook opts in explicitly so offline scenarios (Molecule) skip the
# GitHub download.
backup_engine_install_restic: false

# Host-level Tier1 schedule (TIER-001/D14). Tier1 databases are image-discovered
# with no app declaration, so their schedule is per-host, not per-profile.
backup_tier1_schedule: "*-*-* 01:00:00"

# ── Restore verification (D13/VERIFY-001..004) ──
# A backup is unverified until it is restored. The per-asset cadence follows the
# profile's declared `backup.verification` policy (VERIFY-003): Tier1 assets are
# verified monthly, Tier2 quarterly. Values are systemd OnCalendar expressions.
backup_restore_verify_schedules:
  monthly-restore-test: "*-*-01 04:00:00"
  quarterly-restore-test: "*-01,04,07,10-01 04:00:00"
# Scratch restore target + evidence store for the verification runner. The
# runner restores into <root>/scratch/<app> and persists <root>/evidence/<app>.json.
backup_restore_verify_root: "/var/lib/backup-restore-verify"
backup_restore_verify_scratch_dir: "{{ backup_restore_verify_root }}/scratch"
backup_restore_verify_evidence_dir: "{{ backup_restore_verify_root }}/evidence"
backup_restore_verify_random_delay: 600

# Credential-free EnvironmentFiles for ephemeral restic container runs
# (CRED-005). The `-e NAME="value"` command-line form is forbidden because the
# value is visible in `ps`; these 0600 files are passed with `--env-file`.
restic_run_env_file: "/etc/restic/restic-run.env"
restic_retention_env_file: "/etc/restic/restic-retention.env"

# Retention policy (app-data backup)
backup_keep_daily: 7
backup_keep_weekly: 4
backup_keep_monthly: 12

# ── backup/ + backup-timers/ shared defaults ──
# Retention policy (stack backup)
restic_keep_daily: 7
restic_keep_weekly: 4
restic_keep_monthly: 3

# ── backup-timers/ defaults ──
# backup_db_services/backup_volume_services replaced by fileglob scan of apps/*/profile.yml (ADR-03)
#
# Legacy `backup_r2_*` aliases REMOVED (design D4 / STORAGE-005): the single
# credential namespace is `restic_r2_*` (non-secret coordinates in
# inventory/group_vars/all/main.yml, secrets in the SOPS file). The encrypted
# SOPS file still carries `backup_r2_account_id` / `vault_backup_r2_*` during
# the migration transition because it cannot be re-encrypted mid-flight, but NO
# code consumes them. Remove them from SOPS after the migration gate passes
# (see docs/operations/BACKUP_MIGRATION_RUNBOOK.md §Transition).

# ── Gate - shared across all source roles ──
enable_backups: true

# ── Deployed applications per host (default empty) ──
# Override in inventory/host_vars/<hostname>.yml with list of apps (e.g. [postgresql, n8n]).
deployed_apps: []
